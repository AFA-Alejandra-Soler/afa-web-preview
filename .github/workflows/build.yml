name: Build i publica a GitHub Pages

# Cada volta que algú (la junta via Pages CMS, o algú tocant el repo a mà)
# fa un push a main, este workflow regenera la web des de content/ + assets/
# i la publica amb el mètode oficial de GitHub Pages. La junta MAI executa
# res manualment: guarden en el CMS i el "Commit" ja dispara açò.
#
# PREVIEW=1 va ser el mode de pilotatge (repositori de proves afa-web-preview):
# afig <meta robots noindex> i no escriu CNAME, perquè Google no indexara la
# preview. Des del 4-9-2026 este repositori JA ÉS el de l'AFA (organització
# AFA-Alejandra-Soler), amb el domini afaalejandrasoler.es configurat a
# Settings → Pages i HTTPS forçat. Per això PREVIEW="0": build de producció,
# indexable, amb sitemap.xml i robots.txt permetent el rastreig.
#
# 08-09-2026 — AVÍS SI FALLA (jobs avisa-si-falla / tanca-avis, al final):
# els commits de la junta els firma el bot de Pages CMS, i GitHub només avisa
# per correu a qui dispara el workflow → quan el build fallava NO s'assabentava
# NINGÚ. Eixe dia la junta va estar 5 hores editant (junta, extraescolars
# visibles, horaris) sense que res es publicara, fins que va arribar per
# WhatsApp. Ara, si build o deploy fallen, s'obri una issue assignada a Jorge
# (li arriba per correu) i es tanca sola quan torna a publicar-se bé.
# Requerix Issues activades al repositori (Settings → General → Features).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos builds se solapen si arriben dos pushos seguits.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·la dependències
        run: pip install -r build/requirements.txt

      - name: Genera el lloc (dist/)
        env:
          # Producció (repo del AFA, domini connectat): "0". Només es posa a
          # "1" per a un repositori pilot/preview sense domini propi.
          PREVIEW: "0"
        run: python3 build/generar.py

      - name: Prepara l'artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Si el build o la publicació han fallat: obri una issue (o comenta en la
  # que ja estiga oberta) perquè Jorge reba un correu. El text del commit
  # entra per variable d'entorn (mai interpolat dins del script) per seguretat.
  avisa-si-falla:
    if: ${{ failure() }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      ETIQUETA: build-fallit
      ASSIGNAT: j0rj0
    steps:
      - name: Obri (o actualitza) la issue «la web no s'ha publicat»
        run: |
          gh label create "$ETIQUETA" --color B60205 --description "El build de la web ha fallat: els canvis del CMS no es publiquen" --force
          {
            echo "L'últim canvi guardat des de l'editor **NO s'ha publicat** a la web: el build ha fallat."
            echo
            echo "- Canvi que ho ha disparat: $COMMIT_URL"
            echo "- Missatge del commit: \`${COMMIT_MSG:-(sense missatge)}\`"
            echo "- Registre de l'error (pestanya «Genera el lloc»): $RUN_URL"
            echo
            echo "La web segueix mostrant l'última versió que es va publicar bé. Els canvis guardats al CMS NO es perden: quan s'arregle la causa i el build torne a passar, es publicaran tots de colp."
            echo
            echo "@$ASSIGNAT"
          } > cos.md
          NUM=$(gh issue list --label "$ETIQUETA" --state open --json number --jq '.[0].number // empty' || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body-file cos.md
          else
            gh issue create --title "La web NO s'ha publicat: el build ha fallat" --body-file cos.md --label "$ETIQUETA" --assignee "$ASSIGNAT"
          fi

  # Quan torna a publicar-se bé, tanca la issue d'avís si n'hi havia.
  tanca-avis:
    if: ${{ success() }}
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ETIQUETA: build-fallit
    steps:
      - name: Tanca la issue «la web no s'ha publicat» si estava oberta
        run: |
          for NUM in $(gh issue list --label "$ETIQUETA" --state open --json number --jq '.[].number' || true); do
            gh issue close "$NUM" --comment "Resolt: la web s'ha tornat a publicar correctament ($RUN_URL)."
          done
