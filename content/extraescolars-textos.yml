titol: Extraescolars 2026-2027
titol_es: Extraescolares 2026-2027
subtitol: Tria l'activitat per a vore el seu dossier i inscriure't
subtitol_es: Elige la actividad para ver su dosier e inscribirte
intro1: "<p>Extraescolars per al curs 2026-27: activitats des d'Infantil a
  Primària perquè les nostres criatures gaudeixen, practiquen esport, continuen
  desenvolupant les seues habilitats i capacitats, i també perquè ajuden a
  conciliar a les famílies de l'escola.</p>"
intro1_es: "<p>Extraescolares para el curso 2026-27: actividades desde Infantil
  hasta Primaria para que nuestros niños y niñas disfruten, practiquen deporte,
  sigan desarrollando sus habilidades y capacidades, y también para ayudar a
  conciliar a las familias del cole.</p>"
intro2: <p>Com sempre, tindrem extraescolars privades, impartides per empreses o
  professionals, i extraescolars municipals, facilitades per la <a
  target="_blank" rel="noreferrer noopener"
  href="https://www.fdmvalencia.es/es/">Fundació Esportiva Municipal</a>, amb
  duració anual i preu reduït.</p>
intro2_es: <p>Como siempre, tendremos extraescolares privadas, impartidas por
  empresas o profesionales, y extraescolares municipales, facilitadas por la <a
  target="_blank" rel="noreferrer noopener"
  href="https://www.fdmvalencia.es/es/">Fundación Deportiva Municipal</a>, con
  duración anual y precio reducido.</p>
intro3: <p>Les extraescolars es desenvolupen d'octubre a maig, tant en horari de
  menjador com de vesprada de 16.30 h a 17.30 h o de 17.30 h a 18.30 h, i els
  divendres de 15 h a 16.30 h.</p>
intro3_es: <p>Las extraescolares se desarrollan de octubre a mayo, tanto en
  horario de comedor como de tarde de 16.30 h a 17.30 h o de 17.30 h a 18.30 h,
  y los viernes de 15 h a 16.30 h.</p>
intro4: <p>Per poder participar en les activitats extraescolars privades sense
  pagar matrícula, cal fer-se soci/sòcia de l'AFA abans del 30 de setembre — <a
  target="_blank" rel="noreferrer noopener"
  href="https://www.aulazon.es/categoria-producto/colegios/ceip-alejandra-soler/ampa-afa-ceip-alejandra-soler/">a
  través d'Aulazon</a>.</p>
intro4_es: <p>Para poder participar en las actividades extraescolares privadas
  sin pagar matrícula, hay que hacerse socio/a del AFA antes del 30 de
  septiembre — <a target="_blank" rel="noreferrer noopener"
  href="https://www.aulazon.es/categoria-producto/colegios/ceip-alejandra-soler/ampa-afa-ceip-alejandra-soler/">a
  través de Aulazon</a>.</p>
boto_places: Vore places lliures del mes
boto_places_es: Ver plazas libres del mes
asteriscs_nota: >-
  *Activitats que se realitzen fora del col·le i per tant se necessitarà
  autoritzar a les empreses perquè recullen al alumnat i l'acompanyen a la
  escola en qüestió. (Ho gestiona cada extraescolar)


  **Les activitats amb dos asteriscs, signifiquen que son activitats municipals,
  i per tant, el preu és més reduït.
asteriscs_nota_es: >-
  *Actividades que se realizan fuera del colegio y por tanto se necesitará
  autorizar a las empresas para que recojan al alumnado y lo acompañen a la
  escuela en cuestión. (Lo gestiona cada extraescolar)


  **Las actividades con dos asteriscos significan que son actividades
  municipales, y por tanto, el precio es más reducido.
baixes_titol: Baixes
baixes_titol_es: Bajas
baixes_text: <p>Qualsevol baixa en alguna activitat s'ha de comunicar
  directament al monitor/a o empresa que la imparteix, amb còpia a <a
  href="mailto:extraescolarsalejandrasoler@gmail.com">extraescolarsalejandrasoler@gmail.com</a>.
  L'admissió es fa per ordre d'inscripció.</p>
baixes_text_es: <p>Cualquier baja en alguna actividad se debe comunicar
  directamente al monitor/a o empresa que la imparte, con copia a <a
  href="mailto:extraescolarsalejandrasoler@gmail.com">extraescolarsalejandrasoler@gmail.com</a>.
  La admisión se realiza por orden de inscripción.</p>
