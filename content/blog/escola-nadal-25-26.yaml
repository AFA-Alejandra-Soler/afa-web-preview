titol: Oberta la inscripció a l'Escola de Nadal 25/26
data: '2025-11-24'
data_label: 24 de novembre de 2025
cos_valencia: |-
  <p>Hola, famílies!🌞<br>Un any més tenim l'oportunitat d'oferir el servei de conciliació per a les vacances escolar de nadal. Des del dimarts 23 de desembre fins al dilluns 5 de gener podreu fer que els vostres fills i filles participen a l'Escola de Nadal 2025-2026.</p><p>El termini d'inscripció finalitza el dilluns 15 de desembre.</p><div class="recursos"><a class="recurs" href="../assets/uploads/2025/11/INFANTIL-CEIP-ALEJANDRA-SOLER.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Programació d'activitats per infantil</a><a class="recurs" href="../assets/uploads/2025/11/PRIMARIA-CEIP-ALEJANDRA-SOLER.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Programació d'activitats per primària</a></div><p>A més a més, al següent enllaç podreu trobar les múltiples opcions que podeu escollir i els preus en funció de si es necessita matinera, menjador i/o vespertina. O si sols es necessita una setmana o les dues.</p><div class="recursos"><a class="recurs" href="../assets/uploads/2025/11/CEIP-ALEJANDRA-SOLER-ESCOLA-DE-NADAL-3.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Informació preus</a></div>
cos_castella: |-
  <p><em>¡Hola, familias!🌞<br>Un año más tenemos la oportunidad de ofrecer el servicio de conciliación para las vacaciones escolares de navidad. Des del martes 23 de diciembre hasta el lunes 5 de enero podéis hacer que vuestros/as hijos/as participen en la Escuela de Navidad 2025-2026.</em></p><p><em>El plazo de inscripción finaliza el lunes 15 de diciembre.</em></p><div class="recursos"><a class="recurs" href="../assets/uploads/2025/11/INFANTIL-CEIP-ALEJANDRA-SOLER.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Programación de actividades para infantil</a><a class="recurs" href="../assets/uploads/2025/11/PRIMARIA-CEIP-ALEJANDRA-SOLER.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Programación de actividades para primaria</a></div><p><em>Además en el siguiente enlace podéis encontrar las múltiples opciones que podéis elegir y los precios en función de si necesitáis matinera, comedor y/o vespertina. O si solo necesitáis una semana o las dos.</em></p><div class="recursos"><a class="recurs" href="../assets/uploads/2025/11/CEIP-ALEJANDRA-SOLER-ESCOLA-DE-NADAL-3.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Información precios</a></div>
