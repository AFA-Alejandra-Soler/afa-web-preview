titol: Oberta inscripció Escola de setembre
titol_es: Abierta inscripción Escuela de septiembre
data: '2025-07-17'
data_label: 17 de juliol de 2025
data_label_es: 17 de julio de 2025
cos_valencia: |-
  <p>Hola, famílies!🌞<br>Per a facilitar-vos la conciliació abans del començament del curs 2025-26, un any més us oferim l'Escola de setembre de l'1 al 5 de setembre, amb opció de matinera des de les 8h i servei de conciliació de vesprades fins a les 17.30 h.</p><div class="recursos"><a class="recurs" href="../assets/uploads/2025/07/PROGRAMACIO-MATINS-DE-SETEMBRE_compressed.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Programa d'activitats Escola de setembre</a><a class="recurs" href="../assets/uploads/2025/07/PREUS-ESCOLA-SETEMBRE.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Preus Escola de setembre</a></div><p>També us avancem tota la informació del servei de conciliació de vesprades de setembre, una vegada comence el curs 2025-26 el 8 de setembre.</p><div class="recursos"><a class="recurs" href="../assets/uploads/2025/07/ALEJANDRA-SOLER-NOTA-INFORMATIVA-VESPRADES-DE-SETEMBRE.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Informació conciliació matinera i vesprades setembre</a></div>
cos_castella: |-
  <p><em>¡Hola, familias!🌞<br>Para facilitaros la conciliación antes del comienzo del curso 2025-26, un año más os ofrecemos la Escuela de septiembre del 1 al 5 de septiembre, con opción de matinera desde las 8h y servicio de conciliación de tardes hasta las 17.30 h.</em></p><div class="recursos"><a class="recurs" href="../assets/uploads/2025/07/PROGRAMACIO-MATINS-DE-SETEMBRE_compressed.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Programa actividades Escuela de septiembre</a><a class="recurs" href="../assets/uploads/2025/07/PREUS-ESCOLA-SETEMBRE.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Precios Escuela de septiembre</a></div><p><em>También os avanzamos toda la información del servicio de conciliación de tardes de septiembre, una vez comience el curso 2025-26 el 8 de septiembre.</em></p><div class="recursos"><a class="recurs" href="../assets/uploads/2025/07/ALEJANDRA-SOLER-NOTA-INFORMATIVA-VESPRADES-DE-SETEMBRE.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Información conciliación matinera y tardes septiembre</a></div>
