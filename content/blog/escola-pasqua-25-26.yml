titol: Oberta la inscripció a l'Escola de Pasqua 25/26
data: '2026-03-04'
data_label: 4 de març de 2026
cos_valencia: |-
  <p>Hola, famílies!<br>Un any més tenim l'oportunitat d'oferir el servei de conciliació per a les vacances escolars de pasqua. Des del dijous 2 fins al divendres 10 d'abril podreu fer que els vostres fills i filles participen a l'Escola de Pasqua 2025-2026.</p><p>El termini d'inscripció finalitza el dijous 26 de març.</p><div class="recursos"><a class="recurs" href="../assets/uploads/2026/02/PROGRAMACIO-PASQUA-CEIP-ALEJANDRA-SOLER-1-6.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Programació d'activitats per infantil</a><a class="recurs" href="../assets/uploads/2026/02/PROGRAMACIO-PASQUA-CEIP-ALEJANDRA-SOLER-1_compressed.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Programació d'activitats per primària</a></div><p>A més a més, al següent enllaç podreu trobar les múltiples opcions que podeu escollir i els preus en funció de si es necessita matinera, menjador i/o vespertina.</p><div class="recursos"><a class="recurs" href="../assets/uploads/2026/03/CARTELL-PASQUA-CEIP-ALEJANDRA-SOLER-3.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Informació preus</a></div>
cos_castella: |-
  <p><em>¡Hola, familias!<br>Un año más tenemos la oportunidad de ofrecer el servicio de conciliación para las vacaciones escolares de pascua. Des del jueves 2 hasta el viernes 10 de abril podéis hacer que vuestros/as hijos/as participen en la Escuela de Pascua 2025-2026.</em></p><p><em>El plazo de inscripción finaliza el jueves 26 de marzo.</em></p><div class="recursos"><a class="recurs" href="../assets/uploads/2026/02/PROGRAMACIO-PASQUA-CEIP-ALEJANDRA-SOLER-1-6.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Programación de actividades para infantil</a><a class="recurs" href="../assets/uploads/2026/02/PROGRAMACIO-PASQUA-CEIP-ALEJANDRA-SOLER-1_compressed.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Programación de actividades para primaria</a></div><p><em>Además en el siguiente enlace podéis encontrar las múltiples opciones que podéis elegir y los precios en función de si necesitáis matinera, comedor y/o vespertina.</em></p><div class="recursos"><a class="recurs" href="../assets/uploads/2026/03/CARTELL-PASQUA-CEIP-ALEJANDRA-SOLER-3.pdf" target="_blank" rel="noreferrer noopener"><span class="icona">📄</span> Información precios</a></div>
