  familias del CEIP Alejandra Soler.
cos: "<h2>Matinera i vesprades</h2><p>Inscripció curs 2025/26
  pròximament</p><p>A través de l'asociació Let's Grow School, l'AFA Alejandra
  Soler ofereix dos serveis de conciliació per a famílies en horari
  extraescolar. Es tracta de la matinera, que es desenvolupa de 8 a 9 h., i de
  la conciliació de vesprades, que es desevolupa de 16.30 a 17.30 h. de dilluns
  a dijous i de 15h a 16:30h o 16:30h els divendres, durant els mesos d'octubre
  a maig. I de 15 a 16.30h o 17.30 h en juny i setembre.</p><p>En aquest temps
  l'alumnat realitzarà diferents activitats lúdiques a l'aire lliure i en l'aula
  amb un objetiu d'entreteniment.</p><p>Descarrega <a target=\"_blank\"
  rel=\"noreferrer noopener\" href=\"/assets/uploads/cms/Links
  Conciliació/set-i-juny-2026-2027compressed.pdf\">ací</a> el dossier informatiu
  per al mes de setembre i juny.</p><p>Descarrega <a
  href=\"/assets/uploads/cms/oct-a-maig-2026-2027compressed.pdf\">ací</a> el
  dossier informatiu per al servei de vesprades d'octubre a
  maig.</p><p></p><h3>Matinera</h3><p>Opció de deixar als xiquets i xiquetes en
  l'escola a les 8 h. o a les 8.30 h. de dilluns a divendres, o un dia solt per
  necessitat puntual. L'horari d'entrada a escola és a les 9
  h.</p><ul><li><p><strong>Preu/mes</strong>: 30
  €</p></li><li><p><strong>Preu/mes amb descompte:</strong> 27 € (germans i
  famílies monomarentals)</p></li><li><p><strong>Preu abonament familiar 6
  dies*:</strong> 30 €.</p></li></ul><p>*L'abonament serà d'ús familiar i podrà
  compartir-se entre els membres de la unitat familiar. Serà vàlid durant tot el
  curs acadèmic. Per sol·licitar-lo, cal inscriure's a través del web de Fem
  Escola i indicar \"ABONAMENT\" a l'apartat
  d'observacions.</p><p></p><h3>Vesprades</h3><p>Opció de deixar als xiquets i
  xiquetes en l'escola de 16.30 a 17.30 h. de dilluns a dijous, i els divendres
  de 15 a 16.30 h. o de 15 a 17.30 h. L'horari d'eixida de l'escola de dilluns a
  dijous és a les 16.30 h., i els divendres a les 15
  h.</p><ul><li><p><strong>Preu/mes de dilluns a dijous:</strong> 30
  €</p></li><li><p><strong>Preu/mes de dilluns a dijous amb descompte:</strong>
  27 € (germans i famílies monomarentals)</p></li><li><p><strong>Preu/mes
  divendres 15-16.30 h:</strong> 14 € (11 € amb descompe germans o família
  monomarental)</p></li><li><p><strong>Preu/mes divendres 15-17.30 h:</strong>
  20 € (17 € amb descompe germans o família
  monomarental)</p></li><li><p><strong>Preu/mes divendres 16.30-17.30
  h:</strong> 10 € (7 € amb descompe germans o família
  monomarental)</p></li><li><p><strong>Abonament 6 dies*:</strong> 30
  €</p></li></ul><p>*L'abonament serà d'ús familiar i podrà compartir-se entre
  els membres de la unitat familiar. Serà vàlid durant tot el curs acadèmic. Per
  sol·licitar-lo, cal inscriure's a través del web de Fem Escola i indicar
  \"ABONAMENT\" a l'apartat d'observacions.</p><p><a target=\"_blank\"
  rel=\"noreferrer noopener\" class=\"boton\"
  href=\"https://femescola.tumatricula.es/\">INSCRIPCIÓ A LA MATINERA I
  CONCILIACIÓ VESPRADES</a></p><p><strong>Remarques</strong></p><ul><li><p>En la
  inscripció cal indicar el Codi Postal de l'escola, que és el
  46006.</p></li><li><p>Totes les inscripcions o baixes en el servei s'han de
  fer al web de Fem Escola.</p></li><li><p>La data límit per a realitzar les
  inscripcions serà el dimarts 24 de setembre, encara que les inscripcions
  romandran obertes al llarg del curs.</p></li><li><p>Les baixes han de
  comunicar-se abans del 25 de cada mes.</p></li><li><p>El pagament de les
  activitats serà domiciliat i es realitzarà de l'1 al 5 de cada mes. Un
  impagament (rebut tornat) durà un recàrrec de 5€ i si l'import no es liquida
  en els 3 dies posteriors quedarà fora de l'activitat.</p></li><li><p>Qualsevol
  imprevist en l'ús del servei s'haurà de comunicar directament a Fem Escola.
  Una vegada feta la inscripció, l'empresa us facilitarà el contacte de la
  persona coordinadora.</p></li></ul><p></p>"
cos_es: "<h2>Matinera y tardes</h2><p>Inscripción curso 2025/26
  próximamente</p><p>A través de la asociación Let's Grow School, el AFA
  Alejandra Soler ofrece dos servicios de conciliación para familias en horario
  extraescolar. Se trata de la matinera, que se desarrolla de 8 a 9 h., y de la
  conciliación de tardes, que se desarrolla de 16.30 a 17.30 h.de lunes a jueves
  y de 15h a 16.30h o 16.30h los viernes, durante los meses de octubre a mayo. Y
  de 15 a 16.30h o 17.30 h en junio y septiembre.</p><p>En este tiempo el
  alumnado realizará diferentes actividades lúdicas al aire libre y en el aula
  con un objetivo de entretenimiento.</p><p>Descarga <a target=\"_blank\"
  rel=\"noreferrer noopener\"
  href=\"/assets/uploads/2025/07/ALEJANDRA-SOLER-NOTA-INFORMATIVA-VESPRADES-DE-\
  SETEMBRE.pdf\">aquí</a> el dosier informativo.</p><p>Descarga <a
  target=\"_blank\" rel=\"noreferrer noopener\"
  href=\"/assets/uploads/2025/07/ALEJANDRA-SOLER-NOTA-INFORMATIVA-VESPRADES-DE-\
  SETEMBRE.pdf\">aquí</a> el dossier informativo para el mes de
  septiembre.</p><p>Descarga <a target=\"_blank\" rel=\"noreferrer noopener\"
  href=\"/assets/uploads/2025/09/NOTA-INFORMATIVA-VESPERTINA-OCT-MAIG-CEIP-ALEJ\
  ANDRA-SOLER-VALENCIA-1_compressed.pdf\">aquí</a> el dossier informativo para
  las tardes de octubre a mayo.</p><p></p><h3>Matinera</h3><p>Opción de dejar a
  los niños y niñas en el colegio a las 8 h. o a las 8.30 h. de lunes a viernes,
  o un día suelto por necesidad puntual. El horario de entrada al colegio es a
  las 9 h.</p><ul><li><p><strong>Precio/mes</strong>: 30
  €</p></li><li><p><strong>Precio/mes con descuento:</strong> 27 € (hermanos y
  familias monomarentales)</p></li><li><p><strong>Precio abono familiar 6
  días*:</strong> 30 €.</p></li></ul><p>*El abono será de uso familiar y podrá
  compartirse entre los miembros de la unidad familiar. Será válido durante todo
  el curso académico. Para solicitarlo, hay que inscribirse a través de la web
  de Fem Escola e indicar \"ABONO\" en el apartado de
  observaciones.</p><p></p><h3>Tardes</h3><p>Opción de dejar a los niños y niñas
  en el colegio de 16.30 a 17.30 h. de lunes a jueves, y los viernes de 15 a
  16.30 h. o de 15 a 17.30 h. El horario de salida del colegio de lunes a jueves
  es a las 16.30 h., y los viernes a las 15 h.</p><ul><li><p><strong>Precio/mes
  de lunes a jueves:</strong> 30 €</p></li><li><p><strong>Precio/mes de lunes a
  jueves con descuento:</strong> 27 € (hermanos y familias
  monomarentales)</p></li><li><p><strong>Precio/mes viernes 15-16.30 h:</strong>
  14 € (11 € con descuento hermanos o familia
  monomarental)</p></li><li><p><strong>Precio/mes viernes 15-17.30 h:</strong>
  20 € (17 € con descuento hermanos o familia
  monomarental)</p></li><li><p><strong>Precio/mes viernes 16.30-17.30
  h:</strong> 10 € (7 € con descuento hermanos o familia
  monomarental)</p></li><li><p><strong>Abono 6 días*:</strong> 30
  €</p></li></ul><p>*El abono será de uso familiar y podrá compartirse entre los
  miembros de la unidad familiar. Será válido durante todo el curso académico.
  Para solicitarlo, hay que inscribirse a través de la web de Fem Escola e
  indicar \"ABONO\" en el apartado de observaciones.</p><p><a target=\"_blank\"
  rel=\"noreferrer noopener\" class=\"boton\"
  href=\"https://femescola.tumatricula.es/\">INSCRIPCIÓN A LA MATINERA Y
  CONCILIACIÓN DE TARDES</a></p><p><strong>A destacar</strong></p><ul><li><p>En
  la inscripción hay que indicar el Código Postal del colegio, que es el
  46006.</p></li><li><p>Todas las inscripciones o bajas en el servicio se tienen
  que hacer en la web de Fem Escola.</p></li><li><p>La fecha tope para realizar
  las inscripciones será el martes 24 de septiembre, aunque las inscripciones
  permanecerán abiertas a lo largo del curso.</p></li><li><p>Las bajas tienen
  que comunicarse antes del 25 de cada mes.</p></li><li><p>El pago de las
  actividades será domiciliado y se realizará del 1 al 5 de cada mes. Un impago
  (recibo vuelto) llevará un recargo de 5€ y si el importe no se liquida en los
  3 días posteriores quedará fuera de la actividad.</p></li><li><p>Cualquier
  imprevisto en el uso del servicio se tendrá que comunicar directamente a Fem
  Escola. Una vez hecha la inscripción, la empresa facilitará el contacto de la
  persona coordinadora.</p></li></ul><p></p>"
