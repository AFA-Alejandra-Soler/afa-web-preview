titol: Fes-te membre de l'AFA
subtitol: Quota anual i com pagar-la
meta_desc: 'Com fer-se soci/sòcia de l''AFA CEIP Alejandra Soler: quota anual de 36 € per família via
  Aulazon.'
cos: |-
  <p>Fer-te <strong>família sòcia de l'AFA del CEIP Alejandra Soler o renovar la teua quota per al
  curs 2026/27</strong> és molt fàcil. <strong>Tens fins al 30 d'octubre!</strong></p>
  <div class="caja caja-lila">
    <p><strong>1.</strong> Fes clic en este enllaç d'Aulazon i segueix els passos per abonar la quota en línia:</p>
    <div class="botonera">
      <a class="boton" href="https://www.aulazon.es/categoria-producto/colegios/ceip-alejandra-soler/ampa-afa-ceip-alejandra-soler/" target="_blank" rel="noreferrer noopener">Anar a Aulazon</a>
    </div>
    <p><strong>Quota anual per família: 36 €*</strong></p>
  </div>
  <p class="nota">*Solament es paga una quota anual per família, independentment del nombre de
  fills i filles matriculats en el centre.</p>
  <div class="avis">
    <p><strong>Important:</strong> ja no s'admeten els pagaments de quota per transferència.</p>
  </div>
  <h3>Castellano</h3>
  <p class="nota"><em>Hacerte familia socia de la AFA del CEIP Alejandra Soler o renovar tu cuota
  para el curso 2026/27 es muy fácil. ¡Tienes hasta el 30 de octubre!</em></p>
  <p class="nota"><em>?Haz clic en este enlace de Aulazon y sigue los pasos para abonar la cuota
  online https://www.aulazon.es/categoria-producto/colegios/ceip-alejandra-soler/ampa-afa-ceip-alejandra-soler/</em></p>
  <p class="nota"><em><strong>Cuota anual por familia: 36 €*</strong></em></p>
  <p class="nota"><em>*Solo se paga una cuota anual por familia, independientemente del número de
  hijos e hijas matriculados en el centro.</em></p>
  <p class="nota"><em>‼️IMPORTANTE: Ya no se admitirán los pagos de cuota por transferencia.</em></p>
