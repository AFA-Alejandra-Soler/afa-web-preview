titol: Més que verd
subtitol: Naturalització del pati escolar
meta_desc: 'Més que verd: naturalització de patis escolars impulsada per l''AFA CEIP Alejandra Soler.'
cos: |-
  <p>Més que verd és el resultat de la Comunitat d'Aprenentatge i Pràctica (CAP) al voltant de la
  naturalització de patis escolars, impulsada per l'AFA del CEIP Alejandra Soler, al si de
  Ciutat·lab de Las Naves, Centre d'innovació social i urbana de la ciutat de València. La
  proposta naix amb l'objectiu de desenvolupar un full de ruta per posar en marxa un procés de
  naturalització, més enllà del verd, i fer-ho en col·lectiu, amb diversitat d'agents que prenen
  part en el procés: alumnat del centre, famílies, personal docent, de direcció, de menjador, de
  neteja, experts en urbanisme, en medi ambient, en recerca, ciutadania, etc.</p>
  <p class="nota">
  <em>Més que verd es el resultado de la Comunidad de Aprendizaje y Práctica (CAP) alrededor de la
  naturalización de patios escolares, impulsada por el AFA del CEIP Alejandra Soler, en el seno de
  Ciutat·lab de Las Naves, Centro de innovación social y urbana de la ciudad de València. La
  propuesta nace con el objetivo de desarrollar una hoja de ruta para poner en marcha un proceso de
  naturalización, más allá del verde, y hacerlo en colectivo, con diversidad de agentes que forman
  parte del proceso de naturalización: alumnado del centro, familias, personal docente, de
  dirección, de comedor, de limpieza, expertos en urbanismo, en medio ambiente, en investigación,
  ciudadanía, etc.</em></p>
