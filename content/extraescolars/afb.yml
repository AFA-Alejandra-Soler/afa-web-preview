nota: |-
  Activitat de les <strong>Escoles Esportives Municipals</strong> (Fundació Esportiva Municipal de València): preu reduït i bonificació per a les famílies beneficiàries de la beca de menjador. <strong>Inscripció</strong>: cal omplir el full d'inscripció (PDF) i enviar-lo, junt amb el justificant de pagament, a extraescolarsalejandrasoler@gmail.com. El pagament es fa en dos terminis (inici d'octubre i finals de gener), excepte les famílies amb beca, en un únic termini. Totes les activitats municipals comparteixen dossier, full d'inscripció i full de preus.
descripcio: |-
  Les Escoles Esportives Municipals (EEDD) són el programa de promoció esportiva de la Fundació Esportiva Municipal de València, organitzat amb les federacions esportives: activitat voluntària, complementària de l'Educació Física, en horari no lectiu, a les instal·lacions del col·legi i d'octubre a maig. L'Activitat Física Base és el primer pas de l'itinerari esportiu educatiu, pensat per a Infantil: desenvolupament de l'esquema corporal a través del joc i el moviment, en dos sessions setmanals d'una hora i grups de 12 a 20. Horari del curs 2025-26: dilluns i dimecres de 16:30 a 17:30.
