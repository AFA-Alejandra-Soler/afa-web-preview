nota: |-
  Activitat de les <strong>Escoles Esportives Municipals</strong> (Fundació Esportiva Municipal de València): preu reduït i bonificació per a les famílies beneficiàries de la beca de menjador. <strong>Inscripció</strong>: cal omplir el full d'inscripció (PDF) i enviar-lo, junt amb el justificant de pagament, a extraescolarsalejandrasoler@gmail.com. El pagament es fa en dos terminis (inici d'octubre i finals de gener), excepte les famílies amb beca, en un únic termini. Totes les activitats municipals comparteixen dossier, full d'inscripció i full de preus.
descripcio: |-
  Les Escoles Esportives Municipals (EEDD) són el programa de promoció esportiva de la Fundació Esportiva Municipal de València, organitzat amb les federacions esportives: activitat voluntària, complementària de l'Educació Física, en horari no lectiu, a les instal·lacions del col·legi i d'octubre a maig. Escola Esportiva de Promoció (EDP) d'hoquei, amb la Federació d'Hoquei de la Comunitat Valenciana: iniciació esportiva bàsica per a 3r a 6é de Primària, dos sessions setmanals d'una hora. Horari del curs 2025-26: dimarts i dijous de 16:30 a 17:30.
