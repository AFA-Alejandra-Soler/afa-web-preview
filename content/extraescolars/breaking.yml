nota: |-
  Aquesta activitat la imparteix <strong>Let's Grow School</strong> (associació cultural de hip hop). Comparteix dossier i formulari d'inscripció amb Patins, Skate, Breaking i ExpresArte — són la mateixa entitat, quatre activitats.
descripcio: |-
  Introducció al breaking dance (dansa olímpica, esportiva i acrobàtica) i a la música Funk junt amb la cultura Hip Hop; també s'introdueix la competició de dansa a través de la improvisació i la creativitat acrobàtica. És una activitat física d'alta intensitat, amb molta diversió i autosuperació, apta sobretot per al segon cicle de Primària. Els objectius que es treballen són molt dinàmics i es busca l'enriquiment cultural i de valors socials per al desenvolupament: reflexió, autocrítica, perseverança i extraversió. Durant el curs es fa una Lliga de Breakin en esdeveniments fora del cole, on l'alumnat pot participar lliurement i mesurar les seues habilitats amb alumnat d'altres col·legis i de l'escola oficial, coneixent altres persones que es dediquen al ball i a la competició sana. Dilluns i dimecres de 16:30 a 17:30 (Breaking Kids Primària).
