nota: |-
  Aquesta activitat la imparteix <strong>Let's Grow School</strong> (associació cultural de hip hop). Comparteix dossier i formulari d'inscripció amb Patins, Skate, Breaking i ExpresArte — són la mateixa entitat, quatre activitats.
descripcio: |-
  Introducción a la danza Breaking (danza olímpica, deportiva y acrobática) y a la música Funk junto a la cultura Hip Hop; también se introduce la competición de danza a través de la improvisación y la creatividad acrobática. Es una actividad física de alta intensidad, con mucha diversión y autosuperación, apta sobre todo para segundo ciclo de Primaria. Los objetivos que se trabajan son muy dinámicos y se busca el enriquecimiento cultural y de valores sociales para el desarrollo: reflexión, autocrítica, perseverancia y extroversión. Durante el curso se realiza una Liga de Breakin en eventos fuera del cole, donde el alumnado puede participar libremente y medir sus habilidades con alumnado de otros colegios y de la escuela oficial, conociendo a otras personas que se dedican al baile y a la competición sana. Lunes y miércoles de 16:30 a 17:30 (Breaking Kids Primaria).
