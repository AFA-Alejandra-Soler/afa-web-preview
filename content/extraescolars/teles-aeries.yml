descripcio: |-
  Les teles aèries són el resultat d'un procés de transformació de distintes disciplines artístiques i esportives que combinen la dansa amb les arts circenses i es complementen amb la música. Es practica principalment suspés en l'aire. Exigeix una relació corporal, mental i espiritual, així com una disciplina i una constància rigoroses, ja que combina l'estètica de la dansa amb la força física i la preparació mental necessàries.
descripcio_es: |-
  Las telas aéreas son el resultado de un proceso de transformación de distintas disciplinas artísticas y deportivas que combinan la danza con las artes circenses y se complementan con la música. Se practica principalmente suspendido en el aire. Exige una relación corporal, mental y espiritual, así como una disciplina y una constancia rigurosas, ya que combina la estética de la danza con la fuerza física y la preparación mental necesarias.
