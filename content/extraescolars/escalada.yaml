descripcio: |-
  La escalada es una actividad que consiste en subir o recorrer, realizando depurados movimientos, paredes de roca, laderas escarpadas u otros relieves caracterizados por su verticalidad. La escalada es libertad y expresión, combinar el deporte con la montaña; es un deporte de riesgo y de conocimientos personales. Cada día de escalada es un ejemplo de superación, y es una actividad tanto física como mental que hace que te superes día a día.
