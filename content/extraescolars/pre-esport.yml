nota: |-
  Activitat de les <strong>Escoles Esportives Municipals</strong> (Fundació Esportiva Municipal de València): preu reduït i bonificació per a les famílies beneficiàries de la beca de menjador. <strong>Inscripció</strong>: cal omplir el full d'inscripció (PDF) i enviar-lo, junt amb el justificant de pagament, a extraescolarsalejandrasoler@gmail.com. El pagament es fa en dos terminis (inici d'octubre i finals de gener), excepte les famílies amb beca, en un únic termini. Totes les activitats municipals comparteixen dossier, full d'inscripció i full de preus.
nota_es: |-
  Actividad de las <strong>Escuelas Deportivas Municipales</strong> (Fundació Esportiva Municipal de València): precio reducido y bonificación para las familias beneficiarias de la beca de comedor. <strong>Inscripción</strong>: hay que rellenar la hoja de inscripción (PDF) y enviarla, junto con el justificante de pago, a extraescolarsalejandrasoler@gmail.com. El pago se hace en dos plazos (inicio de octubre y finales de enero), excepto las familias con beca, en un único plazo. Todas las actividades municipales comparten dossier, hoja de inscripción y hoja de precios.
descripcio: |-
  Les Escoles Esportives Municipals (EEDD) són el programa de promoció esportiva de la Fundació Esportiva Municipal de València, organitzat amb les federacions esportives: activitat voluntària, complementària de l'Educació Física, en horari no lectiu, a les instal·lacions del col·legi i d'octubre a maig. El Pre-esport (Predeporte) és l'etapa d'activitats i jocs preesportius per a 1r i 2n de Primària, abans de la iniciació a un esport concret, i inclou la participació en les Miniolimpíades. Dos sessions setmanals d'una hora. Horari del curs 2025-26: dimarts i dijous de 16:30 a 17:30.
descripcio_es: |-
  Las Escuelas Deportivas Municipales (EEDD) son el programa de promoción deportiva de la Fundació Esportiva Municipal de València, organizado con las federaciones deportivas: actividad voluntaria, complementaria de la Educación Física, en horario no lectivo, en las instalaciones del colegio y de octubre a mayo. El Predeporte es la etapa de actividades y juegos predeportivos para 1º y 2º de Primaria, antes de la iniciación a un deporte concreto, e incluye la participación en las Miniolimpiadas. Dos sesiones semanales de una hora. Horario del curso 2025-26: martes y jueves de 16:30 a 17:30.
