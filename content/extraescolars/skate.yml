descripcio: |-
  Clases de introducción al patinaje con tabla (skate). Actividad que permite al alumnado aprender el desplazamiento sobre tabla teniendo en cuenta la seguridad, la agilidad, frenada, giros, saltos. Es una actividad que parte de nivel cero y va aumentando la dificultad y adaptándose al nivel individual, a través de ejercicios y juegos que fomentan la práctica segura. Indicada para alumnado de Primaria.
