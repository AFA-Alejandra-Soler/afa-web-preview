nota: |-
  Aquesta activitat la imparteix <strong>Let's Grow School</strong> (associació cultural de hip hop). Comparteix dossier i formulari d'inscripció amb Patins, Skate, Breaking i ExpresArte — són la mateixa entitat, quatre activitats.
descripcio: |-
  Classes d'introducció al patinatge amb taula (skate). Activitat que, igual que en el patinatge en línia, permet a l'alumnat aprendre el desplaçament sobre taula tenint en compte la seguretat, l'agilitat, la frenada, els girs, els salts... Es parteix de nivell zero i es va augmentant la dificultat, adaptant-se al nivell individual i del grup a través d'exercicis i jocs que fomenten la pràctica segura. Cal tindre el material d'ús personal i de seguretat (taula adequada i proteccions: casc, colzeres, canelleres i genolleres). Indicada per a alumnat de Primària; dimarts i dijous de 17:30 a 18:30.
