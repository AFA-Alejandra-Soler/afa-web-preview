nota: |-
  Aquesta activitat la imparteix <strong>Let's Grow School</strong> (associació cultural de hip hop). Comparteix dossier i formulari d'inscripció amb Patins, Skate, Breaking i ExpresArte — són la mateixa entitat, quatre activitats.
descripcio: |-
  Clases de introducción al patinaje con tabla (skate). Actividad que, igual que en el patinaje en línea, permite al alumnado aprender el desplazamiento sobre tabla teniendo en cuenta la seguridad, la agilidad, frenada, giros, saltos... Se parte de nivel cero y se va aumentando la dificultad, adaptándose al nivel individual y del grupo a través de ejercicios y juegos que fomentan la práctica segura. Es necesario tener el material de uso personal y seguridad (tabla adecuada y protecciones de casco, coderas, muñequeras y rodilleras). Indicada para alumnado de Primaria; martes y jueves de 17:30 a 18:30.
