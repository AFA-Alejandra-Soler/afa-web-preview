descripcio: "<p>Classes d'introducció al patinatge amb taula (skate). Activitat
  que, igual que en el patinatge en línia, permet a l'alumnat aprendre el
  desplaçament sobre taula tenint en compte la seguretat, l'agilitat, la
  frenada, els girs, els salts... Es parteix de nivell zero i es va augmentant
  la dificultat, adaptant-se al nivell individual i del grup a través
  d'exercicis i jocs que fomenten la pràctica segura. Cal tindre el material
  d'ús personal i de seguretat (taula adequada i proteccions: casc, colzeres,
  canelleres i genolleres).</p>"
descripcio_es: "<p>Clases de introducción al patinaje con tabla (skate).
  Actividad que, igual que en el patinaje en línea, permite al alumnado aprender
  el desplazamiento sobre tabla teniendo en cuenta la seguridad, la agilidad, la
  frenada, los giros, los saltos... Se parte de nivel cero y se va aumentando la
  dificultad, adaptándose al nivel individual y del grupo a través de ejercicios
  y juegos que fomentan la práctica segura. Hay que tener el material de uso
  personal y de seguridad (tabla adecuada y protecciones: casco, coderas,
  muñequeras y rodilleras).</p>"
nota: <p>Aquesta activitat la imparteix <strong>Let's Grow School</strong>
  (associació cultural de hip hop). Comparteix dossier i formulari d'inscripció
  amb Patins, Breaking i ExpresArte — són la mateixa entitat, quatre
  activitats.</p>
