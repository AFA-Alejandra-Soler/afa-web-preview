descripcio: |-
  Escuela de tenis dirigida por Vicente Luis Ariño; objetivo que el alumnado aprenda y desarrolle las destrezas básicas del tenis con carácter lúdico, fusionando técnica y diversión. Dirigida a alumnado de infantil y primaria; los entrenadores recogen al alumnado en sus filas/clases y lo acompañan a los patios donde está el material preparado. Las clases comienzan con juegos-entrenamiento en pareja/grupo y continúan cerca de la red practicando golpes básicos, apoyos e imagen; al finalizar, el entrenador acompaña al alumnado hasta su recogida.
