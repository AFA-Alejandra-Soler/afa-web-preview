descripcio: <p>Escola de tenis dirigida per Vicente Luis Ariño; l'objectiu és
  que l'alumnat aprenga i desenvolupe les destreses bàsiques del tenis amb
  caràcter lúdic, fusionant tècnica i diversió. Dirigida a alumnat d'Infantil i
  de Primària; els entrenadors arrepleguen l'alumnat a les seues files o classes
  i l'acompanyen als patis, on està el material preparat. Les classes comencen
  amb jocs-entrenament en parella o en grup i continuen prop de la xarxa
  practicant colps bàsics, suports i imatge; en acabar, l'entrenador acompanya
  l'alumnat fins que el recullen.</p>
descripcio_es: <p>Escuela de tenis dirigida por Vicente Luis Ariño; el objetivo
  es que el alumnado aprenda y desarrolle las destrezas básicas del tenis con
  carácter lúdico, fusionando técnica y diversión. Dirigida a alumnado de
  Infantil y de Primaria; los entrenadores recogen al alumnado en sus filas o
  clases y lo acompañan a los patios, donde está el material preparado. Las
  clases empiezan con juegos-entrenamiento en pareja o en grupo y continúan
  cerca de la red practicando golpes básicos, apoyos e imagen; al terminar, el
  entrenador acompaña al alumnado hasta que lo recogen.</p>
