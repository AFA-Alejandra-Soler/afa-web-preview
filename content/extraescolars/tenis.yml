descripcio: |-
  Escola de tenis dirigida per Vicente Luis Ariño; l'objectiu és que l'alumnat aprenga i desenvolupe les destreses bàsiques del tenis amb caràcter lúdic, fusionant tècnica i diversió. Dirigida a alumnat d'Infantil i de Primària; els entrenadors arrepleguen l'alumnat a les seues files o classes i l'acompanyen als patis, on està el material preparat. Les classes comencen amb jocs-entrenament en parella o en grup i continuen prop de la xarxa practicant colps bàsics, suports i imatge; en acabar, l'entrenador acompanya l'alumnat fins que el recullen. Dilluns de 16:30 a 17:30, a les instal·lacions del col·legi.
