descripcio: |-
  Dansa moderna / dansa urbana amb The Hub Danza, Música y Arte, impartida per Pablo Prieto (ballarí i professor de dansa urbana format a Los Angeles, component de Free Up Family — sis vegades campions nacionals — i representant d'Espanya en el mundial de hip hop de Las Vegas; més de 15 anys de docència). La dansa urbana és un conjunt d'estils de ball nascuts als carrers i als patis d'esbarjo junt amb gèneres musicals com el hip hop, el funk i l'R&B; la seua llibertat d'expressió, energia i actitud la fan única i divertida. Objectius: aprendre a interpretar la música, memòria coreogràfica, creativitat i improvisació, coordinació, condició física, treball en equip i actuació final.
descripcio_es: |-
  Danza moderna / danza urbana con The Hub Danza, Música y Arte, impartida por Pablo Prieto (bailarín y profesor de danza urbana formado en Los Ángeles, componente de Free Up Family — seis veces campeones nacionales — y representante de España en el mundial de hip hop de Las Vegas; más de 15 años de docencia). La danza urbana es un conjunto de estilos de baile nacidos en las calles y en los patios de recreo junto con géneros musicales como el hip hop, el funk y el R&B; su libertad de expresión, energía y actitud la hacen única y divertida. Objetivos: aprender a interpretar la música, memoria coreográfica, creatividad e improvisación, coordinación, condición física, trabajo en equipo y actuación final.
