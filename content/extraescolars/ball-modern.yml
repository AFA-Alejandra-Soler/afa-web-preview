descripcio: |-
  Danza moderna / danza urbana con The Hub Danza, Música y Arte, impartida por Pablo Prieto (bailarín y profesor de danza urbana formado en Los Ángeles, componente de Free Up Family — seis veces campeones nacionales — y representante de España en el mundial de hip hop de Las Vegas; más de 15 años de docencia). La danza urbana es un conjunto de estilos de baile nacidos en las calles y patios de recreo junto a géneros musicales como el hip hop, el funk y el R&B; su libertad de expresión, energía y actitud la hacen única y divertida. Objetivos: aprender a interpretar la música, memoria coreográfica, creatividad e improvisación, coordinación, condición física, trabajo en equipo y actuación final.
