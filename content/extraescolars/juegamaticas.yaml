descripcio: |-
  Un espacio para acercarse a las matemáticas de una forma lúdica y creativa. A través de experiencias divertidas, se busca despertar la curiosidad de los niños para investigar problemas matemáticos cotidianos. Partiendo de la experimentación, usa el JUEGO para aprender matemáticas mediante 5 ejes: Jugar, Crear, Experimentar, Leer e Investigar. Dirigido a niñ@s de 1º a 6º de Primaria, en grupos reducidos (máximo 8 alumnos).
