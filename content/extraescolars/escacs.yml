nota: |-
  Activitat de les <strong>Escoles Esportives Municipals</strong> (Fundació Esportiva Municipal de València): preu reduït i bonificació per a les famílies beneficiàries de la beca de menjador. <strong>Inscripció</strong>: cal omplir el full d'inscripció (PDF) i enviar-lo, junt amb el justificant de pagament, a extraescolarsalejandrasoler@gmail.com. El pagament es fa en dos terminis (inici d'octubre i finals de gener), excepte les famílies amb beca, en un únic termini. Totes les activitats municipals comparteixen dossier, full d'inscripció i full de preus.
descripcio: |-
  Les Escoles Esportives Municipals (EEDD) són el programa de promoció esportiva de la Fundació Esportiva Municipal de València, organitzat amb les federacions esportives: activitat voluntària, complementària de l'Educació Física, en horari no lectiu, a les instal·lacions del col·legi i d'octubre a maig. Escola d'escacs (Escacs Base, Preescacs i Escola de Promoció, segons l'edat): iniciació i pràctica dels escacs a migdia, una sessió setmanal. Horari del curs 2025-26: divendres de 12:45 a 13:45 (1r, 2n i 3r) i de 13:55 a 14:55 (5 anys, 4t, 5é i 6é).
