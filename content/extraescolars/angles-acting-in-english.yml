descripcio: "<p>Aprendre anglès practicant-lo. Les classes d'anglès d'Acting in
  English ofereixen una alternativa dinàmica a l'aprenentatge tradicional de
  l'idioma: l'alumnat utilitza l'anglès des del primer moment mitjançant
  activitats comunicatives que fomenten la participació constant. Es treballa
  l'expressió oral, la comprensió auditiva, la lectura i l'escriptura a través
  de jocs, projectes, cançons, storytelling, activitats cooperatives i reptes
  adaptats al nivell de cada grup.</p>"
descripcio_es: "<p>Aprender inglés practicándolo. Las clases de inglés de Acting
  in English ofrecen una alternativa dinámica al aprendizaje tradicional del
  idioma: el alumnado utiliza el inglés desde el primer momento mediante
  actividades comunicativas que fomentan la participación constante. Se trabaja
  la expresión oral, la comprensión auditiva, la lectura y la escritura a través
  de juegos, proyectos, canciones, storytelling, actividades cooperativas y
  retos adaptados al nivel de cada grupo.</p>"
nota: "<p>Aquesta activitat la imparteix l'acadèmia <strong>Acting in
  English</strong>. Comparteix dossier i formulari d'inscripció amb Acting i Cor
  — són la mateixa acadèmia, tres activitats. </p><p>Esta activitat es realitza
  en la pròpia acadèmia (C/ Cadis, 29): recullen l'alumnat al pati del cole i
  l'acompanyen.</p>"
nota_es: "<p>Esta actividad la imparte la academia <strong>Acting in
