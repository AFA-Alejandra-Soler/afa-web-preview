descripcio: "<p>Un espai per a acostar-se a les matemàtiques d'una manera lúdica
  i creativa. A través d'experiències divertides, es busca despertar la
  curiositat dels xiquets per a investigar problemes matemàtics quotidians;
  partint de l'experimentació, usa el JOC per a aprendre matemàtiques mitjançant
  5 eixos: Jugar, Crear, Experimentar, Llegir i Investigar. Imparteix Beatriz
  Cabrera (arquitecta i Màster en Professorat de Secundària, especialitat
  Matemàtiques). Dos activitats: <strong>JUEGAmáticas</strong>, per a 1r a 4t de
  Primària (grups reduïts, màxim 8), i <strong>JUEGAmáticas-EVOLUTION</strong>,
  per a 5é i 6é, on el joc deixa espai al repte amb la resolució de problemes
  oberts i creatius (metodologia «Building Thinking Classrooms», Peter
  Liljedahl).</p>"
descripcio_es: "<p>Un espacio para acercarse a las matemáticas de una manera
  lúdica y creativa. A través de experiencias divertidas, se busca despertar la
  curiosidad de los niños para investigar problemas matemáticos cotidianos;
  partiendo de la experimentación, usa el JUEGO para aprender matemáticas
  mediante 5 ejes: Jugar, Crear, Experimentar, Leer e Investigar. Imparte
  Beatriz Cabrera (arquitecta y Máster en Profesorado de Secundaria,
  especialidad Matemáticas). Dos actividades: <strong>JUEGAmáticas</strong>,
  para 1º a 4º de Primaria (grupos reducidos, máximo 8), y
  <strong>JUEGAmáticas-EVOLUTION</strong>, para 5º y 6º, donde el juego deja
  espacio al reto con la resolución de problemas abiertos y creativos
  (metodología «Building Thinking Classrooms», Peter Liljedahl).</p>"
