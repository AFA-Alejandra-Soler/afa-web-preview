descripcio: |-
  Un espacio para acercarse a las matemáticas de una forma lúdica y creativa. A través de experiencias divertidas, se busca despertar la curiosidad de los niños para investigar problemas matemáticos cotidianos; partiendo de la experimentación, usa el JUEGO para aprender matemáticas mediante 5 ejes: Jugar, Crear, Experimentar, Leer e Investigar. Imparte Beatriz Cabrera (arquitecta y Máster en Profesorado de Secundaria, especialidad Matemáticas). Dos actividades: <strong>JUEGAmáticas</strong>, para 1º a 4º de Primaria (grupos reducidos, máximo 8), y <strong>JUEGAmáticas-EVOLUTION</strong>, para 5º y 6º, donde el juego deja espacio al reto con la resolución de problemas abiertos y creativos (metodología «Building Thinking Classrooms», Peter Liljedahl). Un día a la semana, según grupo.
