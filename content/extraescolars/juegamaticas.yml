descripcio: |-
  Un espai per a acostar-se a les matemàtiques d'una manera lúdica i creativa. A través d'experiències divertides, es busca despertar la curiositat dels xiquets per a investigar problemes matemàtics quotidians; partint de l'experimentació, usa el JOC per a aprendre matemàtiques mitjançant 5 eixos: Jugar, Crear, Experimentar, Llegir i Investigar. Imparteix Beatriz Cabrera (arquitecta i Màster en Professorat de Secundària, especialitat Matemàtiques). Dos activitats: <strong>JUEGAmáticas</strong>, per a 1r a 4t de Primària (grups reduïts, màxim 8), i <strong>JUEGAmáticas-EVOLUTION</strong>, per a 5é i 6é, on el joc deixa espai al repte amb la resolució de problemes oberts i creatius (metodologia «Building Thinking Classrooms», Peter Liljedahl). Un dia a la setmana, segons el grup.
