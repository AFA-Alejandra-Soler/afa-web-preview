descripcio: |-
  Implantar l'activitat extraescolar de Ioga Infantil dirigida a xiquets i xiquetes de primer, segon i tercer d'Educació Infantil i de primer i segon de Primària, fomentant el seu benestar físic, emocional i social a través del moviment conscient, el joc i la relaxació. El ioga infantil és una ferramenta educativa que s'adapta al desenvolupament evolutiu dels xiquets i les xiquetes, integrant el cos, la respiració i l'atenció plena d'una manera lúdica i respectuosa. Les classes consten d'escalfament amb jocs, postures adaptades, respiració conscient, relaxació guiada, activitats creatives, i contes i visualitzacions; la metodologia és no competitiva, inclusiva i basada en el gaudi.
descripcio_es: |-
  Implantar la actividad extraescolar de Yoga Infantil dirigida a niños y niñas de primero, segundo y tercero de Educación Infantil y de primero y segundo de Primaria, fomentando su bienestar físico, emocional y social a través del movimiento consciente, el juego y la relajación. El yoga infantil es una herramienta educativa que se adapta al desarrollo evolutivo de los niños y las niñas, integrando el cuerpo, la respiración y la atención plena de una manera lúdica y respetuosa. Las clases constan de calentamiento con juegos, posturas adaptadas, respiración consciente, relajación guiada, actividades creativas, y cuentos y visualizaciones; la metodología es no competitiva, inclusiva y basada en el disfrute.
