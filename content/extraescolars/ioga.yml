descripcio: |-
  Implantar la actividad extraescolar de Yoga Infantil dirigida a niños y niñas de Primero, Segundo y Tercero de Educación Infantil, Primero y Segundo de Primaria, fomentando su bienestar físico, emocional y social a través del movimiento consciente, el juego y la relajación. El yoga infantil es una herramienta educativa que se adapta al desarrollo evolutivo de los niños y las niñas, integrando el cuerpo, la respiración y la atención plena de una manera lúdica y respetuosa. Las clases constan de calentamiento con juegos, posturas adaptadas, respiración consciente, relajación guiada, actividades creativas y cuentos y visualizaciones; la metodología es no competitiva, inclusiva y basada en el disfrute.
