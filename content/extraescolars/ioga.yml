descripcio: |-
  Implantar l'activitat extraescolar de Ioga Infantil dirigida a xiquets i xiquetes de primer, segon i tercer d'Educació Infantil i de primer i segon de Primària, fomentant el seu benestar físic, emocional i social a través del moviment conscient, el joc i la relaxació. El ioga infantil és una ferramenta educativa que s'adapta al desenvolupament evolutiu dels xiquets i les xiquetes, integrant el cos, la respiració i l'atenció plena d'una manera lúdica i respectuosa. Les classes consten d'escalfament amb jocs, postures adaptades, respiració conscient, relaxació guiada, activitats creatives, i contes i visualitzacions; la metodologia és no competitiva, inclusiva i basada en el gaudi.
