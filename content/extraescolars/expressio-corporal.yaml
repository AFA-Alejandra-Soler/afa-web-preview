descripcio: |-
  A través de la expresión corporal, el juego y la música se apoya al niño en su desarrollo integral, creando un espacio que permite su expresión, movimiento y juego. Se realizan juegos corporales donde se transforman en animales o personajes, danzas, ejercicios de equilibrio, danza libre y ejercicios de relajación tipo yoga, además de propuestas de representación (dibujo, construcción con maderas, modelaje). Imparte Paula Tormo, psicóloga col. CV09549 y psicomotricista con amplia formación en danza.
