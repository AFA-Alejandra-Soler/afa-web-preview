nota: |-
  Aquesta activitat la imparteix <strong>Kid Pam Pum — La Casita Musical</strong> (C/ Gibraltar, 31): recullen l'alumnat al col·legi i les famílies el repleguen a la Casita Musical. Comparteix dossier amb Música i Peke-teka — són la mateixa escola, dos activitats.
nota_es: |-
  Esta actividad la imparte <strong>Kid Pam Pum — La Casita Musical</strong> (C/ Gibraltar, 31): recogen al alumnado en el colegio y las familias lo recogen en la Casita Musical. Comparte dossier con Música y Peke-teka — son la misma escuela, dos actividades.
descripcio: |-
  L'extraescolar de música del col·legi, ara a La Casita Musical Kid Pam Pum, en el seu 7é any amb el cole. En la classe de música aprenem junts a través del nostre repertori: cançons que ens inspiren i ens ensenyen, amb instruments professionals i tecnologia (bateria acústica, guitarres, baix, pianos i teclat, tecnologia per a crear i gravar), desenvolupant la creativitat, l'escolta i la improvisació; un mestre o mestra acompanya cada grup de 6-7 xiquets i el temps a la zona de joc és limitat per a mantindre l'atenció en la música. Infantil (3, 4 i 5 anys): dimarts; Primària: dijous. Kid Pam Pum arreplega l'alumnat al col·legi a les 16:30 i les famílies el recullen a la Casita Musical a les 18:00.
descripcio_es: |-
  La extraescolar de música del colegio, ahora en La Casita Musical Kid Pam Pum, en su 7º año con el cole. En la clase de música aprendemos juntos a través de nuestro repertorio: canciones que nos inspiran y nos enseñan, con instrumentos profesionales y tecnología (batería acústica, guitarras, bajo, pianos y teclado, tecnología para crear y grabar), desarrollando la creatividad, la escucha y la improvisación; un maestro o maestra acompaña cada grupo de 6-7 niños y el tiempo en la zona de juego es limitado para mantener la atención en la música. Infantil (3, 4 y 5 años): martes; Primaria: jueves. Kid Pam Pum recoge al alumnado en el colegio a las 16:30 y las familias lo recogen en la Casita Musical a las 18:00.
