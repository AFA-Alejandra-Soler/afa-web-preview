nota: |-
  Aquesta activitat la imparteix <strong>Kid Pam Pum — La Casita Musical</strong> (C/ Gibraltar, 31): recullen l'alumnat al col·legi i les famílies el repleguen a la Casita Musical. Comparteix dossier amb Música i Peke-teka — són la mateixa escola, dos activitats.
descripcio: |-
  La extraescolar de música del colegio, ahora en La Casita Musical Kid Pam Pum, en su 7º año con el cole. En la clase de música aprendemos juntos a través de nuestro repertorio: canciones que nos inspiran y enseñan, con instrumentos profesionales y tecnología (batería acústica, guitarras, bajo, pianos y teclado, tecnología para crear y grabar), desarrollando la creatividad, la escucha y la improvisación; un maestro/a acompaña a cada grupo de 6-7 niños y el tiempo en la zona de juego es limitado para mantener el enfoque en la música. Infantil (3, 4 y 5 años): martes; Primaria: jueves. Recogida en el colegio por parte de Kid Pam Pum a las 16:30 y recogida de las familias en la Casita Musical a las 18:00.
