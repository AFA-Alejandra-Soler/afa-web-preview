descripcio: |-
  Aprender música mediante instrumentos (batería, piano, guitarra, bajo, ukelele), voz y cuerpo. En Infantil se usan sonidos del propio cuerpo y percusión, no hace falta traer instrumento (la escuela lo proporciona). A partir de Primaria se trabaja la ejecución en instrumento; se recomienda pero no es obligatorio traerlo. También se puede traer instrumentos reciclados/construidos en casa. Al igual que no se necesita tener talento para aprender a hablar, tampoco es necesario para aprender música.
