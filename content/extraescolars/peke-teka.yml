nota_es: |-
  Esta actividad la imparte <strong>Kid Pam Pum — La Casita Musical</strong> (C/ Gibraltar, 31): recogen al alumnado en el colegio y las familias lo recogen en la Casita Musical. Comparte dossier con Música y Peke-teka — son la misma escuela, dos actividades.
descripcio: |-
  La Peketeka de Kid Pam Pum: tu tries, tu decideixes, tu gaudeixes. Ací els xiquets decideixen en tot moment què volen fer: interpretem les seues cançons favorites i juguen, creen i es diverteixen sense límits — triem i toquem les seues cançons preferides, accés il·limitat a la zona de joc (llit elàstic, jocs i més), i si toquen música guanyen Somriures que poden usar al Mercadet per a triar joguets, classes especials i sorpreses. Llibertat, creativitat i diversió en un ambient segur. Divendres, per a Infantil i Primària: Kid Pam Pum arreplega l'alumnat al col·legi a les 15:00 i les famílies el recullen a la Casita Musical a les 16:45.
descripcio_es: |-
  La Peketeka de Kid Pam Pum: tú eliges, tú decides, tú disfrutas. Aquí los niños deciden en todo momento qué quieren hacer: interpretamos sus canciones favoritas y juegan, crean y se divierten sin límites — elegimos y tocamos sus canciones preferidas, acceso ilimitado a la zona de juego (cama elástica, juegos y más), y si tocan música ganan Sonrisas que pueden usar en el Mercadillo para elegir juguetes, clases especiales y sorpresas. Libertad, creatividad y diversión en un ambiente seguro. Viernes, para Infantil y Primaria: Kid Pam Pum recoge al alumnado en el colegio a las 15:00 y las familias lo recogen en la Casita Musical a las 16:45.
