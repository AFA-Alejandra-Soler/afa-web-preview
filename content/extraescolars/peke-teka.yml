nota: |-
  Aquesta activitat la imparteix <strong>Kid Pam Pum — La Casita Musical</strong> (C/ Gibraltar, 31): recullen l'alumnat al col·legi i les famílies el repleguen a la Casita Musical. Comparteix dossier amb Música i Peke-teka — són la mateixa escola, dos activitats.
descripcio: |-
  La Peketeka de Kid Pam Pum: tú eliges, tú decides, tú disfrutas. Aquí los niños deciden todo el tiempo lo que quieren hacer: interpretamos sus canciones favoritas y juegan, crean y se divierten sin límites — elegimos y tocamos sus canciones favoritas, acceso ilimitado a la zona de juego (cama elástica, juegos y más), y si tocan música ganan Sonrisas que pueden usar en el Mercadillo para elegir juguetes, clases especiales y sorpresas. Libertad, creatividad y diversión en un ambiente seguro. Viernes, para Infantil y Primaria: recogida en el colegio por parte de Kid Pam Pum a las 15:00 y recogida de las familias en la Casita Musical a las 16:45.
