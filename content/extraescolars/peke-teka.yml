descripcio: "<p>La Peketeka de Kid Pam Pum: tu tries, tu decideixes, tu
  gaudeixes. Ací els xiquets decideixen en tot moment què volen fer: interpretem
  les seues cançons favorites i juguen, creen i es diverteixen sense límits —
  triem i toquem les seues cançons preferides, accés il·limitat a la zona de joc
  (llit elàstic, jocs i més), i si toquen música guanyen Somriures que poden
  usar al Mercadet per a triar joguets, classes especials i sorpreses.
  Llibertat, creativitat i diversió en un ambient segur.</p>"
descripcio_es: "<p>La Peketeka de Kid Pam Pum: tú eliges, tú decides, tú
  disfrutas. Aquí los niños deciden en todo momento qué quieren hacer:
  interpretamos sus canciones favoritas y juegan, crean y se divierten sin
  límites — elegimos y tocamos sus canciones preferidas, acceso ilimitado a la
  zona de juego (cama elástica, juegos y más), y si tocan música ganan Sonrisas
  que pueden usar en el Mercadillo para elegir juguetes, clases especiales y
  sorpresas. Libertad, creatividad y diversión en un ambiente seguro.</p>"
nota: "<p>Aquesta activitat la imparteix <strong>Kid Pam Pum — La Casita
  Musical</strong> (C/ Gibraltar, 31): recullen l'alumnat al col·legi i les
  famílies el repleguen a la Casita Musical. Comparteix dossier amb Música — són
  la mateixa escola, dos activitats.</p>"
nota_es: "<p>Esta actividad la imparte <strong>Kid Pam Pum — La Casita
