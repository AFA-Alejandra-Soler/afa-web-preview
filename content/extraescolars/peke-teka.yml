descripcio: |-
  La Peketeka es una fiesta creativa a través de la cual fomentamos la libertad de elección, el trabajo en equipo y la mezcla de edades. En la Peketeka, el esfuerzo siempre es valorado con algo tangible que pueden llevar a casa. Los retos que proponemos incluyen bailes, escritura a dos manos, canto de ritmos o melodías, juegos deportivos con integración rítmica, y percusión corporal, con una lista de música cuidadosamente seleccionada. Este año se ha incluido a los cursos de 1º, 2º y 3º de Primaria (antes solo Infantil); alumnos de Primaria pueden traer su instrumento, los de Infantil es mejor que no.
