descripcio: |-
  Pensem amb les mans: descobrim com veiem el món i com el sentim, explorem la matèria i l'energia, la força i el moviment, i creem artefactes cientificoartístics i videoclips de stop motion. En fusionar art, ciència i cultura maker s'aprenen conceptes científics i STEAM (llum i òptica, ones i acústica, forces i impuls, biologia i percepció), habilitats maker i d'enginyeria (prototips propis, resolució de problemes i tolerància a la frustració, ús creatiu de materials quotidians i reciclatge) i pensament crític i creativitat («què passa si…?»). Exemples: cub infinit, tub de llum, làmpada amb circuits de paper, llibre d'espills, ombres de colors, pintar amb llum, màscares de cartó o escultures en equilibri. Alumnat de 1r a 4t de Primària; divendres de 15:00 a 16:30, d'octubre a maig, en una aula del centre.
