  Esta actividad la imparte <strong>nube7</strong>. Comparte dossier y formulario de inscripción con Tecnonautas y CreActivitat — son la misma empresa, dos actividades.
descripcio: |-
  Pensem amb les mans: descobrim com veiem el món i com el sentim, explorem la matèria i l'energia, la força i el moviment, i creem artefactes cientificoartístics i videoclips de stop motion. En fusionar art, ciència i cultura maker s'aprenen conceptes científics i STEAM (llum i òptica, ones i acústica, forces i impuls, biologia i percepció), habilitats maker i d'enginyeria (prototips propis, resolució de problemes i tolerància a la frustració, ús creatiu de materials quotidians i reciclatge) i pensament crític i creativitat («què passa si…?»). Exemples: cub infinit, tub de llum, làmpada amb circuits de paper, llibre d'espills, ombres de colors, pintar amb llum, màscares de cartó o escultures en equilibri. Alumnat de 1r a 4t de Primària; divendres de 15:00 a 16:30, d'octubre a maig, en una aula del centre.
descripcio_es: |-
  Pensamos con las manos: descubrimos cómo vemos el mundo y cómo lo sentimos, exploramos la materia y la energía, la fuerza y el movimiento, y creamos artefactos científico-artísticos y videoclips de stop motion. Al fusionar arte, ciencia y cultura maker se aprenden conceptos científicos y STEAM (luz y óptica, ondas y acústica, fuerzas e impulso, biología y percepción), habilidades maker y de ingeniería (prototipos propios, resolución de problemas y tolerancia a la frustración, uso creativo de materiales cotidianos y reciclaje) y pensamiento crítico y creatividad («¿qué pasa si…?»). Ejemplos: cubo infinito, tubo de luz, lámpara con circuitos de papel, libro de espejos, sombras de colores, pintar con luz, máscaras de cartón o esculturas en equilibrio. Alumnado de 1º a 4º de Primaria; viernes de 15:00 a 16:30, de octubre a mayo, en un aula del centro.
