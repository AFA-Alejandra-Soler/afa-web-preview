nota: |-
  Aquesta activitat la imparteix l'acadèmia <strong>Acting in English</strong>. Comparteix dossier i formulari d'inscripció amb Acting in English, Cor i Anglès — són la mateixa acadèmia, tres activitats.
descripcio: |-
  Aprender inglés a través del teatro. Las clases de Acting utilizan el teatro como herramienta para desarrollar la comunicación, la imaginación y la confianza: juegos teatrales, improvisaciones, expresión corporal, creación de personajes, mímica, storytelling, trabajo con escenas y pequeñas representaciones adaptadas a cada edad; en Primaria se trabaja además con textos y personajes, desarrollando técnicas de interpretación y expresión oral. A diferencia de una clase tradicional, el idioma se utiliza para actuar, colaborar, crear historias y resolver situaciones reales. Programa de Acting in English (desde 2018) con actuaciones de Navidad y de verano ante las familias. Infantil (4 y 5 años) los martes y Primaria los miércoles, a mediodía.
