descripcio: |-
  Taller Laboratori de creativitat i experimentació artística impartit per Maria Barrachina, artista, il·lustradora i veterinària. Les xiquetes i els xiquets proven múltiples materials, tècniques i procediments (dibuix, pintura, volum, enquadernació, estampació, origami, collage, fang) al llarg de huit mesos, amb grups diferenciats d'Infantil i de Primària adaptats a cada etapa. L'objectiu és potenciar la creativitat utilitzant el joc, la diversió i la llibertat d'expressió com a elements principals de l'aprenentatge. S'imparteix a migdia, un dia a la setmana, d'octubre a maig, en grups de 8 a 10 per nivells d'edat.
