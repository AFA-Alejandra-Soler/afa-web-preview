descripcio: |-
  Taller Laboratorio de creatividad y experimentación artística impartido por María Barrachina, artista, ilustradora y veterinaria. Las niñas y niños prueban múltiples materiales, técnicas y procedimientos (dibujo, pintura, volumen, encuadernación, estampación, origami, collage, barro) a lo largo de ocho meses, con grupos diferenciados de Infantil y Primaria adaptados a cada etapa. El objetivo es potenciar la creatividad utilizando el juego, la diversión y la libertad de expresión como elementos principales del aprendizaje.
