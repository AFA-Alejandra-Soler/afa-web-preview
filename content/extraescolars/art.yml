descripcio: <p>Taller Laboratori de creativitat i experimentació artística
  impartit per Maria Barrachina, artista, il·lustradora i veterinària. Les
  xiquetes i els xiquets proven múltiples materials, tècniques i procediments
  (dibuix, pintura, volum, enquadernació, estampació, origami, collage, fang) al
  llarg de huit mesos, amb grups diferenciats d'Infantil i de Primària adaptats
  a cada etapa. L'objectiu és potenciar la creativitat utilitzant el joc, la
  diversió i la llibertat d'expressió com a elements principals de
  l'aprenentatge.</p>
descripcio_es: <p>Taller Laboratorio de creatividad y experimentación artística
  impartido por Maria Barrachina, artista, ilustradora y veterinaria. Las niñas
  y los niños prueban múltiples materiales, técnicas y procedimientos (dibujo,
  pintura, volumen, encuadernación, estampación, origami, collage, barro) a lo
  largo de ocho meses, con grupos diferenciados de Infantil y de Primaria
  adaptados a cada etapa. El objetivo es potenciar la creatividad utilizando el
  juego, la diversión y la libertad de expresión como elementos principales del
  aprendizaje.</p>
