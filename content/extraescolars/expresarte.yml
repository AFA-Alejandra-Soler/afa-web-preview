descripcio: "<p>ExpresArte Infantil: l'expressió artística és una forma de
  comunicació i de desenvolupament integral dels xiquets i les xiquetes
  d'Educació Infantil. Es presenten activitats que permeten a l'alumnat
  manifestar-se des de la música, el ball, l'escultura, el teatre i la pintura:
  exercicis artístics de diferents estils i formes d'expressió perquè vagen
  rebent estímuls diferents, buscant sempre les millors activitats per a arribar
  a tot l'alumnat tenint en compte les seues preferències. Pensada per a
  Educació Infantil, per a ampliar el coneixement sobre si mateixos, sobre els
  seus companys i companyes i sobre el món que els envolta.</p>"
descripcio_es: "<p>ExpresArte Infantil: la expresión artística es una forma de
  comunicación y de desarrollo integral de los niños y las niñas de Educación
  Infantil. Se presentan actividades que permiten al alumnado manifestarse desde
  la música, el baile, la escultura, el teatro y la pintura: ejercicios
  artísticos de diferentes estilos y formas de expresión para que vayan
  recibiendo estímulos diferentes, buscando siempre las mejores actividades para
  llegar a todo el alumnado teniendo en cuenta sus preferencias. Pensada para
  Educación Infantil, para ampliar el conocimiento sobre sí mismos, sobre sus
  compañeros y compañeras y sobre el mundo que les rodea.</p>"
nota: <p>Aquesta activitat la imparteix <strong>Let's Grow School</strong>
  (associació cultural de hip hop). Comparteix dossier i formulari d'inscripció
  amb Patins, Skate i Breaking — són la mateixa entitat, quatre activitats.</p>
