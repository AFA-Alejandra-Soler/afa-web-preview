descripcio: |-
  ExpresArte Infantil: la expresión artística es una forma de comunicación y desarrollo integral de los niños y niñas de Educación Infantil. Se presentan actividades que permiten al alumnado manifestarse desde la música, el baile, la escultura, el teatro y la pintura: ejercicios artísticos de diferentes estilos y formas de expresión para que vayan teniendo estímulos diferentes, buscando siempre las mejores actividades para llegar a todo el alumnado teniendo en cuenta sus preferencias. Pensada para Educación Infantil, para ampliar el conocimiento sobre sí mismos, sobre sus compañeros y compañeras y sobre el mundo que les rodea. Viernes de 15:00 a 16:30.
