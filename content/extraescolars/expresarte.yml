nota: |-
  Aquesta activitat la imparteix <strong>Let's Grow School</strong> (associació cultural de hip hop). Comparteix dossier i formulari d'inscripció amb Patins, Skate, Breaking i ExpresArte — són la mateixa entitat, quatre activitats.
descripcio: |-
  ExpresArte Infantil: l'expressió artística és una forma de comunicació i de desenvolupament integral dels xiquets i les xiquetes d'Educació Infantil. Es presenten activitats que permeten a l'alumnat manifestar-se des de la música, el ball, l'escultura, el teatre i la pintura: exercicis artístics de diferents estils i formes d'expressió perquè vagen rebent estímuls diferents, buscant sempre les millors activitats per a arribar a tot l'alumnat tenint en compte les seues preferències. Pensada per a Educació Infantil, per a ampliar el coneixement sobre si mateixos, sobre els seus companys i companyes i sobre el món que els envolta. Divendres de 15:00 a 16:30.
