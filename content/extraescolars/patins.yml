descripcio: |-
  Clases de introducción al patinaje en línea. Actividad que permite al alumnado aprender los fundamentos básicos del desplazamiento sobre ruedas; seguridad, agilidad, frenada, giros, saltos. Actividad muy adaptable a todas las edades y niveles de progresión, con mucha diversión. Actividad indicada para alumnado de Educación Infantil y de Primaria (grupos separados). Con objetivos desde nivel cero a intermedio según el ritmo de cada niño/a.
