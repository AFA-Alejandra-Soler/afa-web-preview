nota: |-
  Aquesta activitat la imparteix <strong>Let's Grow School</strong> (associació cultural de hip hop). Comparteix dossier i formulari d'inscripció amb Patins, Skate, Breaking i ExpresArte — són la mateixa entitat, quatre activitats.
descripcio: |-
  Clases de introducción al patinaje en línea. Actividad que permite al alumnado aprender los fundamentos básicos del desplazamiento sobre ruedas — seguridad, agilidad, frenada, giros, saltos — para que luego puedan ir al parque o de paseo libre con confianza. Actividad muy adaptable a todas las edades y niveles de progresión, muy divertida. Indicada para alumnado de Educación Infantil y de Primaria (grupos separados), desde nivel cero a intermedio según el ritmo de cada niño/a. Patinaje Infantil: lunes y miércoles; Patinaje Primaria: martes y jueves, de 16:30 a 17:30.
