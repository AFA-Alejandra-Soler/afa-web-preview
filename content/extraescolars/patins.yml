descripcio: <p>Classes d'introducció al patinatge en línia. Activitat que permet
  a l'alumnat aprendre els fonaments bàsics del desplaçament sobre rodes —
  seguretat, agilitat, frenada, girs, salts — perquè després puguen anar al parc
  o de passeig lliure amb confiança. Activitat molt adaptable a totes les edats
  i nivells de progressió, i molt divertida. Indicada per a alumnat d'Educació
  Infantil i de Primària (grups separats), des de nivell zero fins a intermedi
  segons el ritme de cada xiquet o xiqueta.</p>
descripcio_es: <p>Clases de introducción al patinaje en línea. Actividad que
  permite al alumnado aprender los fundamentos básicos del desplazamiento sobre
  ruedas — seguridad, agilidad, frenada, giros, saltos — para que después puedan
  ir al parque o de paseo libre con confianza. Actividad muy adaptable a todas
  las edades y niveles de progresión, y muy divertida. Indicada para alumnado de
  Educación Infantil y de Primaria (grupos separados), desde nivel cero hasta
  intermedio según el ritmo de cada niño o niña.</p>
nota: <p>Aquesta activitat la imparteix <strong>Let's Grow School</strong>
  (associació cultural de hip hop). Comparteix dossier i formulari d'inscripció
  amb Skate, Breaking i ExpresArte — són la mateixa entitat, quatre
  activitats.</p>
