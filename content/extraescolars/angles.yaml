nota: |-
  Es realitza en la pròpia acadèmia «Loops Academy» (C/ Vivons, 23).
descripcio: |-
  El inglés enseñado a partir de cuentos y manualidades. Loops Academy trabaja las diferentes áreas del idioma de forma lúdica: un cuento por trimestre trabajado en dos etapas (vocabulario nuevo mediante juegos como memory game, sopa de letras o adivinanzas, y manualidades como representación del escenario o diseño de personajes). Para los niños mayores se usa el método británico Talk for Writing, reforzando pronunciación mediante repetición y gestos; a lo largo del año se celebran clases temáticas (Christmas, Halloween, Spring, Easter).
