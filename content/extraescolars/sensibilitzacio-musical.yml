descripcio: "<p>Iniciació i sensibilització musical per a Infantil, a càrrec de
  Consuelo Hueso (cantant i cofundadora de The Hub, amb més de 20 anys
  d'experiència en escenaris com el Teatro Real de Madrid i el Palau de la
  Música de València i més de 15 de docència, especialista en educació musical
  infantil). La música en la infància impulsa el desenvolupament integral:
  cognitiu i llenguatge, motricitat i coordinació, benestar emocional i social,
  creativitat i imaginació. Pilars: el ritme (percussió corporal, paraules i
  moviment), el cos com a primer instrument, els instruments (panderos, claus,
  caixes xineses...) i la dramatització i la dansa.</p>"
descripcio_es: "<p>Iniciación y sensibilización musical para Infantil, a cargo
  de Consuelo Hueso (cantante y cofundadora de The Hub, con más de 20 años de
  experiencia en escenarios como el Teatro Real de Madrid y el Palau de la
  Música de València y más de 15 de docencia, especialista en educación musical
  infantil). La música en la infancia impulsa el desarrollo integral: cognitivo
  y lenguaje, motricidad y coordinación, bienestar emocional y social,
  creatividad e imaginación. Pilares: el ritmo (percusión corporal, palabras y
  movimiento), el cuerpo como primer instrumento, los instrumentos (panderos,
  claves, cajas chinas...) y la dramatización y la danza.</p>"
nota: <p>Aquesta activitat la imparteix <strong>The Hub — Danza, Música y
  Arte</strong>. Comparteix formulari d'inscripció amb Gimnàstica Rítmica i Ball
  Modern — són la mateixa escola, tres activitats (cada una amb el seu
  dossier).</p>
nota_es: <p>Esta actividad la imparte <strong>The Hub — Danza, Música y
  Arte</strong>. Comparte formulario de inscripción con Gimnasia Rítmica y Ball
  Modern — son la misma escuela, tres actividades (cada una con su dossier).</p>
