nota: |-
  Aquesta activitat la imparteix <strong>The Hub — Danza, Música y Arte</strong>. Comparteix formulari d'inscripció amb Iniciació i Sensibilització Musical, Gimnàstica Rítmica i Ball Modern — són la mateixa escola, tres activitats (cada una amb el seu dossier).
descripcio: |-
  Iniciació i sensibilització musical per a Infantil, a càrrec de Consuelo Hueso (cantant i cofundadora de The Hub, amb més de 20 anys d'experiència en escenaris com el Teatro Real de Madrid i el Palau de la Música de València i més de 15 de docència, especialista en educació musical infantil). La música en la infància impulsa el desenvolupament integral: cognitiu i llenguatge, motricitat i coordinació, benestar emocional i social, creativitat i imaginació. Pilars: el ritme (percussió corporal, paraules i moviment), el cos com a primer instrument, els instruments (panderos, claus, caixes xineses...) i la dramatització i la dansa. Divendres de 15:00 a 16:30.
