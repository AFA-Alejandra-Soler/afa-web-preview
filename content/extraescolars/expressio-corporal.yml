descripcio: <p>A través de l'expressió corporal, el joc i la música es dona
  suport al xiquet en el seu desenvolupament integral, creant un espai que
  permet la seua expressió, el moviment i el joc. Es fan jocs corporals en què
  es transformen en animals o personatges, danses, exercicis d'equilibri, dansa
  lliure i exercicis de relaxació tipus ioga, a més de propostes de
  representació (dibuix, construcció amb fustes, modelatge). Imparteix Paula
  Tormo, psicòloga col. CV09549 i psicomotricista amb àmplia formació en
  dansa.</p>
descripcio_es: <p>A través de la expresión corporal, el juego y la música se
  apoya al niño en su desarrollo integral, creando un espacio que permite su
  expresión, el movimiento y el juego. Se hacen juegos corporales en los que se
  transforman en animales o personajes, danzas, ejercicios de equilibrio, danza
  libre y ejercicios de relajación tipo yoga, además de propuestas de
  representación (dibujo, construcción con maderas, modelado). Imparte Paula
  Tormo, psicóloga col. CV09549 y psicomotricista con amplia formación en
  danza.</p>
