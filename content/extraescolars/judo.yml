descripcio: |-
  El Judo es un deporte olímpico recomendado por la UNESCO como la mejor actividad deportiva para el desarrollo motriz en la infancia. El club JUDOKAN VALENCIA tiene una dilatada experiencia integrado en el barrio de Russafa desde hace 40 años, trabaja con más de 1000 niños entre sus sedes y colegios, es referente en toda España a nivel competitivo y desarrolla proyectos sociales e inclusivos (ONCE, fundación Vicente Ferrer). Imparten Jorge Moral (licenciado en CAFD, diplomado en Fisioterapia, Maestro Nacional de Judo, cinturón negro 5º DAN) y Marcos Mora (cinturón negro 1º DAN, monitor y árbitro regional, profesor de Judo en la edad de Infantil).
