descripcio: "<p>El judo és un esport olímpic recomanat per la UNESCO com la
  millor activitat esportiva per al desenvolupament motriu en la infància. El
  club JUDOKAN VALÈNCIA té una dilatada experiència, integrat al barri de
  Russafa des de fa 40 anys: treballa amb més de 1.000 xiquets entre les seues
  seus i col·legis, és referent a tota Espanya a nivell competitiu i desenvolupa
  projectes socials i inclusius (ONCE, fundació Vicente Ferrer). Imparteixen
  Jorge Moral (llicenciat en CAFE, diplomat en Fisioteràpia, Mestre Nacional de
  Judo, cinturó negre 5é DAN) i Marcos Mora (cinturó negre 1r DAN, monitor i
  àrbitre regional, professor de judo).</p>"
descripcio_es: "<p>El judo es un deporte olímpico recomendado por la UNESCO como
  la mejor actividad deportiva para el desarrollo motriz en la infancia. El club
  JUDOKAN VALÈNCIA tiene una dilatada experiencia, integrado en el barrio de
  Russafa desde hace 40 años: trabaja con más de 1.000 niños entre sus sedes y
  colegios, es referente en toda España a nivel competitivo y desarrolla
  proyectos sociales e inclusivos (ONCE, fundación Vicente Ferrer). Imparten
  Jorge Moral (licenciado en CAFE, diplomado en Fisioterapia, Maestro Nacional
  de Judo, cinturón negro 5º DAN) y Marcos Mora (cinturón negro 1º DAN, monitor
  y árbitro regional, profesor de judo).</p>"
