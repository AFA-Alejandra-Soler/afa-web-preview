descripcio: |-
  El parkour forma persones físicament i mentalment fortes, capaces de respondre davant d'una emergència i de ser útils a la societat ajudant altres persones de manera altruista. És una activitat física, una disciplina i una filosofia de vida que consisteix a desplaçar-se, mitjançant recorreguts, usant les habilitats del propi cos en qualsevol entorn d'una manera fluida i eficaç. Durant els entrenaments, utilitzen la imaginació i l'ajuda de tot l'equip per a crear i millorar els seus recorreguts, moviments o reptes.
descripcio_es: |-
  El parkour forma personas física y mentalmente fuertes, capaces de responder ante una emergencia y de ser útiles a la sociedad ayudando a otras personas de manera altruista. Es una actividad física, una disciplina y una filosofía de vida que consiste en desplazarse, mediante recorridos, usando las habilidades del propio cuerpo en cualquier entorno de una manera fluida y eficaz. Durante los entrenamientos, utilizan la imaginación y la ayuda de todo el equipo para crear y mejorar sus recorridos, movimientos o retos.
