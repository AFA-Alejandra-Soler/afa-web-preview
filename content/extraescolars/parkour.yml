descripcio: |-
  El parkour forma personas física y mentalmente fuertes, capaces de responder ante una emergencia y ser útiles a la sociedad ayudando a otras personas de forma altruista. Es una actividad física, disciplina y filosofía de vida que consiste en desplazarse, mediante recorridos, usando las habilidades del propio cuerpo en cualquier entorno de una manera fluida y eficaz. Durante los entrenamientos, utilizan su imaginación y la ayuda de todo el equipo para crear y mejorar sus recorridos, movimientos o retos.
