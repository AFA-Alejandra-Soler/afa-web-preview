nota: |-
  Aquesta activitat la imparteix <strong>The Hub — Danza, Música y Arte</strong>. Comparteix formulari d'inscripció amb Iniciació i Sensibilització Musical, Gimnàstica Rítmica i Ball Modern — són la mateixa escola, tres activitats (cada una amb el seu dossier).
descripcio: |-
  Gimnasia rítmica para 5 años y 1º y 2º de Primaria, con la entrenadora Carla Fabregat (gimnasta desde los 5 años, con podio en un Campeonato de España, con los tres niveles oficiales de entrenadora de gimnasia rítmica y formándose en Ciencias de la Actividad Física y el Deporte). Beneficios: concentración, flexibilidad, equilibrio, ritmo y música, autoestima, compañerismo, expresión artística, fuerza y salud, y diversión. Este curso, introducción a los aparatos de la gimnasia rítmica (cinta, aro, pelota y mazas) de forma divertida y adaptada a su edad, a través del juego y el movimiento. Viernes de 15:00 a 16:30.
