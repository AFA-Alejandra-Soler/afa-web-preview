descripcio: "<p>Gimnàstica rítmica per a 5 anys i 1r i 2n de Primària, amb
  l'entrenadora Carla Fabregat (gimnasta des dels 5 anys, amb podi en un
  Campionat d'Espanya, amb els tres nivells oficials d'entrenadora de gimnàstica
  rítmica i formant-se en Ciències de l'Activitat Física i l'Esport). Beneficis:
  concentració, flexibilitat, equilibri, ritme i música, autoestima,
  companyonia, expressió artística, força i salut, i diversió. Este curs,
  introducció als aparells de la gimnàstica rítmica (cinta, cèrcol, pilota i
  maces) d'una manera divertida i adaptada a la seua edat, a través del joc i el
  moviment.</p>"
descripcio_es: "<p>Gimnasia rítmica para 5 años y 1º y 2º de Primaria, con la
  entrenadora Carla Fabregat (gimnasta desde los 5 años, con podio en un
  Campeonato de España, con los tres niveles oficiales de entrenadora de
  gimnasia rítmica y formándose en Ciencias de la Actividad Física y el
  Deporte). Beneficios: concentración, flexibilidad, equilibrio, ritmo y música,
  autoestima, compañerismo, expresión artística, fuerza y salud, y diversión.
  Este curso, introducción a los aparatos de la gimnasia rítmica (cinta, aro,
  pelota y mazas) de una manera divertida y adaptada a su edad, a través del
  juego y el movimiento.</p>"
nota: <p>Aquesta activitat la imparteix <strong>The Hub — Danza, Música y
