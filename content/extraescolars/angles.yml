descripcio: "<p>L'anglés ensenyat a partir de contes i manualitats. Loops
  Academy treballa les diferents àrees de l'idioma de manera lúdica: el conte,
  l'obra de teatre o el poema es converteixen en el fil conductor de les
  activitats (vocabulari nou mitjançant jocs, manualitats com la representació
  de l'escenari o el disseny de personatges, música i ritmes). És una manera
  lúdica de treballar les quatre competències de l'idioma — listening, reading,
  writing i speaking — amb professorat nadiu, classes personalitzades i grups
  reduïts que afavoreixen l'«speaking», sobretot en els jocs de rol. Grups
  d'Infantil i de Primària; al llarg de l'any se celebren classes temàtiques
  (Christmas, Halloween, Spring, Easter).</p>"
descripcio_es: "<p>El inglés enseñado a partir de cuentos y manualidades. Loops
  Academy trabaja las distintas áreas del idioma de manera lúdica: el cuento, la
  obra de teatro o el poema se convierten en el hilo conductor de las
  actividades (vocabulario nuevo mediante juegos, manualidades como la
  representación del escenario o el diseño de personajes, música y ritmos). Es
  una manera lúdica de trabajar las cuatro competencias del idioma — listening,
  reading, writing y speaking — con profesorado nativo, clases personalizadas y
  grupos reducidos que favorecen el «speaking», sobre todo en los juegos de rol.
  Grupos de Infantil y de Primaria; a lo largo del año se celebran clases
  temáticas (Christmas, Halloween, Spring, Easter).</p>"
nota: <p>Es realitza en la pròpia acadèmia «Loops Academy» (C/ Vivons, 23).</p>
