descripcio: |-
  L'anglés ensenyat a partir de contes i manualitats. Loops Academy treballa les diferents àrees de l'idioma de manera lúdica: el conte, l'obra de teatre o el poema es converteixen en el fil conductor de les activitats (vocabulari nou mitjançant jocs, manualitats com la representació de l'escenari o el disseny de personatges, música i ritmes). És una manera lúdica de treballar les quatre competències de l'idioma — listening, reading, writing i speaking — amb professorat nadiu, classes personalitzades i grups reduïts que afavoreixen l'«speaking», sobretot en els jocs de rol. Grups d'Infantil i de Primària; al llarg de l'any se celebren classes temàtiques (Christmas, Halloween, Spring, Easter).
