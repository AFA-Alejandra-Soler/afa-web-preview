descripcio: |-
  El inglés enseñado a partir de cuentos y manualidades. Loops Academy trabaja las diferentes áreas del idioma de forma lúdica: el cuento, la obra de teatro o el poema se convierten en el hilo conductor de las actividades (vocabulario nuevo mediante juegos, manualidades como representación del escenario o diseño de personajes, música y ritmos). Es una forma lúdica de trabajar las cuatro competencias del idioma — listening, reading, writing y speaking — con profesores nativos, clases personalizadas y grupos reducidos que favorecen el «speaking», sobre todo en los juegos de roles. Grupos de Infantil y de Primaria; a lo largo del año se celebran clases temáticas (Christmas, Halloween, Spring, Easter).
