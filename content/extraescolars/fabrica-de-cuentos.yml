descripcio: |-
  Taller de narrativa, dibuix i llibres impartit per Marcos Farina (dissenyador gràfic, il·lustrador i autor de llibres infantils). Busca implicar els xiquets amb els llibres des d'un lloc actiu, motivant-los a contar les seues pròpies històries i a descobrir el plaer de crear-les i contar-les a través d'imatges. Es treballa l'expressió oral i la narració, la creativitat, la comunicació a través del dibuix, l'estructura bàsica d'un conte (inici–mig–final) i el vincle positiu amb els llibres i la lectura. El dibuix és la ferramenta principal; s'exploren també el collage, els segells i la pintura, i es fan llibres muts, abecedaris, llibres desplegables i llibres llençol, individuals i col·lectius. Grup Infantil (4 i 5 anys): divendres de 15:00 a 16:30; grup Primària (1r a 3r): dimecres de 16:30 a 17:30.
