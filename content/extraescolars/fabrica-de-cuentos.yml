descripcio: <p>Taller de narrativa, dibuix i llibres impartit per Marcos Farina
  (dissenyador gràfic, il·lustrador i autor de llibres infantils). Busca
  implicar els xiquets amb els llibres des d'un lloc actiu, motivant-los a
  contar les seues pròpies històries i a descobrir el plaer de crear-les i
  contar-les a través d'imatges. Es treballa l'expressió oral i la narració, la
  creativitat, la comunicació a través del dibuix, l'estructura bàsica d'un
  conte (inici–mig–final) i el vincle positiu amb els llibres i la lectura. El
  dibuix és la ferramenta principal; s'exploren també el collage, els segells i
  la pintura, i es fan llibres muts, abecedaris, llibres desplegables i llibres
  llençol, individuals i col·lectius.</p>
descripcio_es: <p>Taller de narrativa, dibujo y libros impartido por Marcos
  Farina (diseñador gráfico, ilustrador y autor de libros infantiles). Busca
  implicar a los niños con los libros desde un lugar activo, motivándolos a
  contar sus propias historias y a descubrir el placer de crearlas y contarlas a
  través de imágenes. Se trabaja la expresión oral y la narración, la
  creatividad, la comunicación a través del dibujo, la estructura básica de un
  cuento (inicio–mitad–final) y el vínculo positivo con los libros y la lectura.
  El dibujo es la herramienta principal; se exploran también el collage, los
  sellos y la pintura, y se hacen libros mudos, abecedarios, libros desplegables
  y libros sábana, individuales y colectivos.</p>
