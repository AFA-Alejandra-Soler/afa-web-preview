descripcio: |-
  Atelier de Pintura, impartit per Elena Maroto (artista visual i educadora artística, llicenciada en Belles Arts, amb més de deu anys dirigint la seua pròpia acadèmia de pintura). Un enfocament basat en els fonaments de la pintura, adaptat a l'edat, els interessos i el ritme de cada xiquet i xiqueta: observació i esbossos, dibuix al carbonet, taca de color, construcció capa a capa, veladures i detalls finals. Es treballen bodegons, paisatges, retrats, animals, obres abstractes i projectes personals, amb la inspiració d'artistes com Van Gogh, Sorolla, Monet o Matisse. Es pinta principalment amb acrílic i tots els materials estan inclosos (cavallets, pinzells, llenços...): només cal portar una bata. Grups reduïts (8-10) de migdia per a Primària (dos torns) i de vesprada, dimarts i dijous de 16:30 a 17:30, per a Infantil i Primària; d'octubre a maig.
descripcio_es: |-
  Atelier de Pintura, impartido por Elena Maroto (artista visual y educadora artística, licenciada en Bellas Artes, con más de diez años dirigiendo su propia academia de pintura). Un enfoque basado en los fundamentos de la pintura, adaptado a la edad, los intereses y el ritmo de cada niño y niña: observación y bocetos, dibujo al carboncillo, mancha de color, construcción capa a capa, veladuras y detalles finales. Se trabajan bodegones, paisajes, retratos, animales, obras abstractas y proyectos personales, con la inspiración de artistas como Van Gogh, Sorolla, Monet o Matisse. Se pinta principalmente con acrílico y todos los materiales están incluidos (caballetes, pinceles, lienzos...): solo hay que traer una bata. Grupos reducidos (8-10) de mediodía para Primaria (dos turnos) y de tarde, martes y jueves de 16:30 a 17:30, para Infantil y Primaria; de octubre a mayo.
