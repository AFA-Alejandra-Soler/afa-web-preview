descripcio: "<p>Les Escoles Esportives Municipals (EEDD) són el programa de
  promoció esportiva de la Fundació Esportiva Municipal de València, organitzat
  amb les federacions esportives: activitat voluntària, complementària de
  l'Educació Física, en horari no lectiu, a les instal·lacions del col·legi i
  d'octubre a maig. Escola Esportiva de Promoció (EDP) de gimnàstica rítmica,
  amb la Federació de Gimnàstica de la Comunitat Valenciana: iniciació esportiva
  bàsica per a 3r a 6é de Primària, dos sessions setmanals d'una
  hora.</p><p></p><p>**Els grups de <strong>Gimnasia Rítmica</strong> es
  formaran per ordre d’inscripció. És a dir, trieu la preferència horària i quan
  un grup estigui ple, automàticament les inscripcions posteriors passaran a
  emplenar el altre grup.<br>Una vegada rebut i tramitat, us responem al correu
  perquè estigueu sabedors de quan s’ha tramitat i en quin horari s’ha fet la
  inscripció. Si no rebeu resposta és perquè no ho hem rebut.</p>"
descripcio_es: "<p>Las Escuelas Deportivas Municipales (EEDD) son el programa de
  promoción deportiva de la Fundació Esportiva Municipal de València, organizado
  con las federaciones deportivas: actividad voluntaria, complementaria de la
  Educación Física, en horario no lectivo, en las instalaciones del colegio y de
  octubre a mayo. Escuela Deportiva de Promoción (EDP) de gimnasia rítmica, con
  la Federación de Gimnasia de la Comunitat Valenciana: iniciación deportiva
  básica para 3º a 6º de Primaria, dos sesiones semanales de una
  hora.</p><p></p><p>**Los grupos de <strong>Gimnasia Rítmica</strong> se
  formaran por orden de inscripción. Es decir, elegís la preferencia horaria y
  cuando un grupo esté lleno, automáticamente las inscripciones posteriores
  pasaran a llenar el otro grupo.<br>Una vez recibamos y tramitemos, os
  respondemos al correo para que sepáis cuando se ha tramitado y en qué horario
  se ha hecho la inscripción. Si no recibís respuesta es porqué no lo hemos
  recibido.</p>"
nota: "<p>Activitat de les <strong>Escoles Esportives Municipals</strong>
  (Fundació Esportiva Municipal de València): preu reduït i bonificació per a
  les famílies beneficiàries de la beca de menjador.
  <strong>Inscripció</strong>: cal omplir el full d'inscripció (PDF) i
  enviar-lo, junt amb el justificant de pagament, a
  extraescolarsalejandrasoler@gmail.com. El pagament es fa en dos terminis
  (inici d'octubre i finals de gener), excepte les famílies amb beca, en un únic
  termini. Totes les activitats municipals comparteixen dossier, full
  d'inscripció i full de preus.</p>"
nota_es: "<p>Actividad de las <strong>Escuelas Deportivas Municipales</strong>
  (Fundació Esportiva Municipal de València): precio reducido y bonificación
  para las familias beneficiarias de la beca de comedor.
  <strong>Inscripción</strong>: hay que rellenar la hoja de inscripción (PDF) y
  enviarla, junto con el justificante de pago, a
  extraescolarsalejandrasoler@gmail.com. El pago se hace en dos plazos (inicio
  de octubre y finales de enero), excepto las familias con beca, en un único
  plazo. Todas las actividades municipales comparten dosier, hoja de inscripción
  y hoja de precios.</p>"
