nota: |-
  Aquesta activitat la imparteix l'acadèmia <strong>Acting in English</strong>. Comparteix dossier i formulari d'inscripció amb Acting in English, Cor i Anglès — són la mateixa acadèmia, tres activitats.
descripcio: |-
  Aprender inglés a través de la música. El coro de Acting in English va mucho más allá de aprender canciones: cada sesión combina repertorio, técnica vocal, juegos musicales y ejercicios inspirados en el teatro musical para desarrollar la voz, la musicalidad y la expresión artística. Se trabaja la respiración, la afinación, el ritmo, la proyección de la voz, la escucha activa y la interpretación con dinámicas adaptadas a cada edad, y el canto se convierte en una actividad cooperativa. El inglés aparece de forma natural en las canciones, las instrucciones y las actividades. Infantil (4 y 5 años) los lunes y Primaria los viernes, a mediodía.
