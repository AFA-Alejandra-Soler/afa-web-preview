descripcio: "<p>Aprendre anglès a través de la música. El cor amb Acting in
  English va molt més enllà d'aprendre cançons: cada sessió combina repertori,
  tècnica vocal, jocs musicals i exercicis inspirats en el teatre musical per a
  desenvolupar la veu, la musicalitat i l'expressió artística. Es treballa la
  respiració, l'afinació, el ritme, la projecció de la veu, l'escolta activa i
  la interpretació amb dinàmiques adaptades a cada edat, i el cant es converteix
  en una activitat cooperativa. L'anglès apareix de manera natural en les
  cançons, les instruccions i les activitats.</p>"
descripcio_es: "<p>Aprender inglés a través de la música. El coro de Acting in
  English va mucho más allá de aprender canciones: cada sesión combina
  repertorio, técnica vocal, juegos musicales y ejercicios inspirados en el
  teatro musical para desarrollar la voz, la musicalidad y la expresión
  artística. Se trabaja la respiración, la afinación, el ritmo, la proyección de
  la voz, la escucha activa y la interpretación con dinámicas adaptadas a cada
  edad, y el canto se convierte en una actividad cooperativa. El inglés aparece
  de forma natural en las canciones, las instrucciones y las actividades.</p>"
nota: <p>Aquesta activitat la imparteix l'acadèmia <strong>Acting in
  English</strong>. Comparteix dossier i formulari d'inscripció amb Acting, i
  Anglès — són la mateixa acadèmia, tres activitats.</p>
nota_es: <p>Esta actividad la imparte la academia <strong>Acting in
  English</strong>. Comparte dossier y formulario de inscripción con Acting, e
  Inglés — son la misma academia, tres actividades.</p>
