nota: |-
  Aquesta activitat la imparteix <strong>nube7</strong>. Comparteix dossier i formulari d'inscripció amb Tecnonautes i CreActivitat — són la mateixa empresa, dos activitats.
descripcio: |-
  Tecnonautas I (1º-2º primaria): primeros pasos en programación/algorítmica (code.org), robótica educativa (¿qué es un robot?, circuitos de papel, ODS Agenda 2030) y diseño 3D con 3D Slash. Tecnonautas II (3º-4º primaria): programación de videojuegos e historias interactivas con Scratch, programación de la placa micro:bit, diseño 3D con Tinkercad. Tecnonautas III (5º-6º primaria): videojuegos retro con Scratch, robots Maqueen+micro:bit resolviendo retos (sensores, sigue línea, esquiva obstáculos), diseño 2D/3D con Tinkercad, sculpt gl, GIMP e Inkscape. Clases de una hora en el aula de informática del centro, de octubre a mayo.
