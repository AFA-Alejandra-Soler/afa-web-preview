descripcio: |-
  Tecnonautes I (1r-2n de Primària): primers passos en programació/algorítmica (code.org), robòtica educativa (què és un robot?, circuits de paper, ODS de l'Agenda 2030) i disseny 3D amb 3D Slash. Tecnonautes II (3r-4t): programació de videojocs i històries interactives amb Scratch, programació de la placa micro:bit, disseny 3D amb Tinkercad. Tecnonautes III (5é-6é): videojocs retro amb Scratch, robots Maqueen + micro:bit resolent reptes (sensors, seguir la línia, esquivar obstacles), disseny 2D/3D amb Tinkercad, sculpt gl, GIMP i Inkscape. Classes d'una hora a l'aula d'informàtica del centre, d'octubre a maig.
