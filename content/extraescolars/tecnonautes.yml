descripcio: "<p>Tecnonautes I (1r-2n de Primària): primers passos en
  programació/algorítmica (code.org), robòtica educativa (què és un robot?,
  circuits de paper, ODS de l'Agenda 2030) i disseny 3D amb 3D Slash.
  Tecnonautes II (3r-4t): programació de videojocs i històries interactives amb
  Scratch, programació de la placa micro:bit, disseny 3D amb Tinkercad.
  Tecnonautes III (5é-6é): videojocs retro amb Scratch, robots Maqueen +
  micro:bit resolent reptes (sensors, seguir la línia, esquivar obstacles),
  disseny 2D/3D amb Tinkercad, sculpt gl, GIMP i Inkscape. Classes d'una hora a
  l'aula d'informàtica del centre, d'octubre a maig.</p>"
descripcio_es: "<p>Tecnonautes I (1º-2º de Primaria): primeros pasos en
  programación/algorítmica (code.org), robótica educativa (¿qué es un robot?,
  circuitos de papel, ODS de la Agenda 2030) y diseño 3D con 3D Slash.
  Tecnonautes II (3º-4º): programación de videojuegos e historias interactivas
  con Scratch, programación de la placa micro:bit, diseño 3D con Tinkercad.
  Tecnonautes III (5º-6º): videojuegos retro con Scratch, robots Maqueen +
  micro:bit resolviendo retos (sensores, seguir la línea, esquivar obstáculos),
  diseño 2D/3D con Tinkercad, sculpt gl, GIMP e Inkscape. Clases de una hora en
  el aula de informática del centro, de octubre a mayo.</p>"
nota: <p>Aquesta activitat la imparteix <strong>nube7</strong>. Comparteix
  dossier i formulari d'inscripció amb CreActivitat — són la mateixa empresa,
  dos activitats.</p>
