descripcio: |-
  L'escalada és una activitat que consisteix a pujar o recórrer, amb moviments depurats, parets de roca, vessants escarpats o altres relleus caracteritzats per la seua verticalitat. L'escalada és llibertat i expressió, combinar l'esport amb la muntanya; és un esport de risc i de coneixements personals. Cada dia d'escalada és un exemple de superació, i és una activitat tant física com mental que fa que et superes dia a dia.
descripcio_es: |-
  La escalada es una actividad que consiste en subir o recorrer, con movimientos depurados, paredes de roca, laderas escarpadas u otros relieves caracterizados por su verticalidad. La escalada es libertad y expresión, combinar el deporte con la montaña; es un deporte de riesgo y de conocimiento personal. Cada día de escalada es un ejemplo de superación, y es una actividad tanto física como mental que hace que te superes día a día.
