# Configuració de Pages CMS (pagescms.org) — ADR 002.
#
# La junta MAI veu HTML ni YAML en cru: només els formularis que definix este
# fitxer. Cada canvi que guarden ("Commit") dispara el build automàtic
# (.github/workflows/build.yml), que regenera la web i la publica.
#
# Els fitxers pujats des del CMS (una foto nova, un dossier nou) es guarden a
# `assets/uploads/cms/` — una carpeta A PART de `assets/uploads/YYYY/MM/`
# (que és la migració de la web anterior, no es toca a mà).
#
# Orde del menú (04-09-2026): el menú lateral de Pages CMS es construix en
# l'orde de declaració d'ESTA llista `content:` (verificat al codi font de
# Pages CMS, `lib/config.ts`, funció `normalizeContentEntries()`: cada entrada
# es converteix en un ítem pla de navegació amb `label`, en el mateix orde en
# què apareix ací — reordenar només afecta el menú, no `name`/`path`/camps).
# Les 4 seccions relacionades amb la pàgina Extraescolars porten el prefix
# «Extraescolars / …» al label perquè es vegen juntes i identificables. Pages
# CMS SÍ suporta grups plegables de veres (`type: group` + `items`, vore
# `ContentGroupSchema` a lib/config-schema.ts i el sidebar) — s'ha preferit el
# prefix al label perquè no exigix provar-ho abans en el repositori de proves.

media:
  - name: cms
    label: Fitxers pujats des de l'editor
    input: assets/uploads/cms
    output: /assets/uploads/cms
    rename: safe

content:
  # --------------------------------------------------------------------
  # Extraescolars / Activitats — una fitxa per activitat (inclou "Activitats
  # municipals"). 1a de les 4 seccions «Extraescolars / …» (activitats,
  # places lliures, horaris, textos de la pàgina).
  # --------------------------------------------------------------------
  - name: extraescolars
    label: "Extraescolars / Activitats"
    type: collection
    path: content/extraescolars
    format: yaml
    filename: "{primary}.yml"
    view:
      primary: nom
      sort: [nom]
    fields:
      - name: nom
        label: Nom de l'activitat
        type: string
        required: true

      - name: nom_es
        label: "Nom de l'activitat (castellà)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el nom en valencià."

      - name: empresa
        label: "Empresa o professional que la imparteix"
        type: string
        required: false
        description: "Es mostra davall del nom a la llista i com «Impartida per: …» a la fitxa."

      - name: activa
        label: Activa (visible a la web)
        type: boolean
        default: true
        # Camp clau (ADR 002): posar-lo en "No" equival a llevar l'activitat
        # de la web — desapareix de la llista i de la seua pròpia pàgina,
        # sense haver d'esborrar el fitxer ni tocar cap altra pàgina.

      - name: cursos
        label: "Cursos als quals va dirigida"
        type: select
        required: false
        description: "Marca tots els cursos que apareixen al dossier. Si no en marques cap, l'activitat es veu sempre al desplegable «Filtrar per curs» de la web."
        # Verificat al codi font de Pages CMS (fields/core/select/index.tsx, 28-08-2026):
        # `options.multiple: true` guarda una llista de cadenes (el que llig generar.py).
        # NO posar `list: true` — faria una llista de llistes.
        options:
          multiple: true
          values:
            - value: I3
              label: "3 anys"
            - value: I4
              label: "4 anys"
            - value: I5
              label: "5 anys"
            - value: P1
              label: "1r de Primària"
            - value: P2
              label: "2n de Primària"
            - value: P3
              label: "3r de Primària"
            - value: P4
              label: "4t de Primària"
            - value: P5
              label: "5é de Primària"
            - value: P6
              label: "6é de Primària"

      - name: imatge
        label: "Imatge de portada (foto o logo)"
        type: image
        options:
          media: cms
        description: "Si no es puja cap imatge, la fitxa mostra un color de reserva amb les inicials."

      - name: dossier
        label: "Dossier — fitxer PDF"
        type: file
        options:
          media: cms
          extensions: [pdf]

      - name: dossier_label
        label: "Text del botó del dossier (opcional; per defecte «Dossier»)"
        type: string
        required: false

      - name: dossier_label_es
        label: "Text del botó del dossier (castellà, opcional)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: dossier2
        label: "Dossier alternatiu (opcional, només si n'hi ha dos)"
        type: file
        required: false
        options:
          media: cms
          extensions: [pdf]

      - name: dossier2_label
        label: "Text del botó del segon dossier (opcional)"
        type: string
        required: false

      - name: dossier2_label_es
        label: "Text del botó del segon dossier (castellà, opcional)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: form
        label: "Enllaç al formulari d'inscripció (Google Forms)"
        type: string
        required: false
        description: "Si es deixa buit, la fitxa mostra «Formulari d'inscripció: pendent de publicar»."

      - name: form2
        label: "Enllaç a un segon formulari (opcional)"
        type: string
        required: false

      - name: descripcio
        label: "Descripció de l'activitat"
        type: rich-text
        required: false
        options:
          format: html
          media: false
          switcher: false

      - name: descripcio_es
        label: "Descripció de l'activitat (castellà)"
        type: rich-text
        required: false
        options:
          format: html
          media: false
          switcher: false
        description: "Si es deixa buit, la web mostra la descripció en valencià."

      - name: nota
        label: "Nota destacada (opcional — horari especial, ubicació...)"
        type: rich-text
        required: false
        options:
          format: html
          media: false
          switcher: false

      - name: nota_es
        label: "Nota destacada (castellà, opcional)"
        type: rich-text
        required: false
        options:
          format: html
          media: false
          switcher: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: ph
        label: "Color de reserva (tècnic, no cal tocar-lo)"
        type: string
        hidden: true

      - name: es_municipal
        label: "És una activitat municipal (FDM): inscripció per PDF, no per Google Form"
        type: boolean
        hidden: true

      - name: inscripcio_pdf
        label: "Full d'inscripció — PDF (només activitats municipals)"
        type: file
        required: false
        options:
          media: cms
          extensions: [pdf]

      - name: bonificacio
        label: "Sol·licitud de bonificació — PDF (només activitats municipals)"
        type: file
        required: false
        options:
          media: cms
          extensions: [pdf]

      - name: info_preus
        label: "Preus i cursos — PDF (només activitats municipals)"
        type: file
        required: false
        options:
          media: cms
          extensions: [pdf]

  # --------------------------------------------------------------------
  # Extraescolars / Places lliures — fitxer únic (imatge mensual del
  # calendari). 2a de les 4 seccions «Extraescolars / …».
  # --------------------------------------------------------------------
  - name: places-lliures
    label: "Extraescolars / Places lliures"
    type: file
    path: content/places-lliures.yml
    format: yaml
    fields:
      - name: mes_label
        label: "Mes publicat (text, p. ex. «curs 2025-26 (juny)»)"
        type: string
        required: true

      - name: mes_label_es
        label: "Mes publicat (castellà, opcional)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: imatge
        label: "Imatge del calendari de places"
        type: image
        required: true
        options:
          media: cms

      - name: pdf
        label: "PDF del calendari (opcional, si n'hi ha en compte de foto)"
        type: file
        required: false
        options:
          media: cms
          extensions: [pdf]

  # --------------------------------------------------------------------
  # Extraescolars / Horaris — NOMÉS el bloc «Horaris per curs» DINS la
  # pàgina Extraescolars (imatge de l'horari general, PDF de preus de les
  # activitats municipals i una imatge d'horari per nivell/curs). NO és la
  # pàgina Extraescolars sencera: la resta dels seus textos (títol,
  # paràgrafs d'introducció, botó, nota dels asteriscs, apartat Baixes) es
  # gestionen a «Extraescolars / Textos de la pàgina» (extraescolars-textos.yml).
  # 3a de les 4 seccions «Extraescolars / …».
  # --------------------------------------------------------------------
  - name: horaris
    label: "Extraescolars / Horaris"
    type: file
    path: content/horaris.yml
    format: yaml
    fields:
      - name: nota
        label: "Nota sobre els horaris (p. ex. «Horaris del curs 2025-26...»)"
        type: string
        required: false

      - name: nota_es
        label: "Nota sobre els horaris (castellà, opcional)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: horari_general
        label: "Horari general — imatge"
        type: image
        required: false
        options:
          media: cms

      - name: preus_municipals
        label: "Activitats municipals: preus i cursos — PDF"
        type: file
        required: false
        options:
          media: cms
          extensions: [pdf]

      - name: horaris_nivell
        label: "Horaris per nivell/curs (un per curs, en l'orde en què es mostren)"
        type: object
        list: true
        fields:
          - name: curs
            label: "Curs (p. ex. «3 anys», «1er Primària»)"
            type: string
            required: true
          - name: curs_es
            label: "Curs (castellà, opcional)"
            type: string
            required: false
            description: "Si es deixa buit, la web mostra el text en valencià."
          - name: imatge
            label: "Imatge de l'horari d'este curs"
            type: image
            required: true
            options:
              media: cms

  # --------------------------------------------------------------------
  # Extraescolars / Textos de la pàgina (04-09-2026) — títol, subtítol, els
  # 4 paràgrafs d'introducció, el text del botó de "places lliures", la
  # nota dels asteriscs (**) i l'apartat Baixes de la pàgina Extraescolars.
  # NO inclou els textos de la secció «Horaris per curs» (van a
  # «Extraescolars / Horaris»). 4a de les 4 seccions «Extraescolars / …».
  # --------------------------------------------------------------------
  - name: extraescolars-textos
    label: "Extraescolars / Textos de la pàgina"
    type: file
    path: content/extraescolars-textos.yml
    format: yaml
    fields:
      - name: titol
        label: "Títol (H1)"
        type: string

      - name: titol_es
        label: "Títol (castellà)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: subtitol
        label: "Subtítol"
        type: string

      - name: subtitol_es
        label: "Subtítol (castellà)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: intro1
        label: "Paràgraf 1"
        type: rich-text
        options:
          format: html
          media: false
          switcher: false

      - name: intro1_es
        label: "Paràgraf 1 (castellà)"
        type: rich-text
        required: false
        options:
          format: html
          media: false
          switcher: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: intro2
        label: "Paràgraf 2 (amb l'enllaç a la FDM)"
        type: rich-text
        options:
          format: html
          media: false
          switcher: false

      - name: intro2_es
        label: "Paràgraf 2 (castellà, amb l'enllaç a la FDM)"
        type: rich-text
        required: false
        options:
          format: html
          media: false
          switcher: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: intro3
        label: "Paràgraf 3 (horaris)"
        type: rich-text
        options:
          format: html
          media: false
          switcher: false

      - name: intro3_es
        label: "Paràgraf 3 (castellà, horaris)"
        type: rich-text
        required: false
        options:
          format: html
          media: false
          switcher: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: intro4
        label: "Paràgraf 4 (soci abans del 30 de setembre, enllaç Aulazon)"
        type: rich-text
        options:
          format: html
          media: false
          switcher: false

      - name: intro4_es
        label: "Paràgraf 4 (castellà, soci abans del 30 de setembre, enllaç Aulazon)"
        type: rich-text
        required: false
        options:
          format: html
          media: false
          switcher: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: boto_places
        label: "Text del botó de places lliures"
        type: string

      - name: boto_places_es
        label: "Text del botó de places lliures (castellà)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: asteriscs_nota
        label: "Nota dels asteriscs (**)"
        type: string

      - name: asteriscs_nota_es
        label: "Nota dels asteriscs (castellà)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: baixes_titol
        label: "Títol de l'apartat Baixes"
        type: string

      - name: baixes_titol_es
        label: "Títol de l'apartat Baixes (castellà)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: baixes_text
        label: "Text de l'apartat Baixes"
        type: rich-text
        options:
          format: html
          media: false
          switcher: false

      - name: baixes_text_es
        label: "Text de l'apartat Baixes (castellà)"
        type: rich-text
        required: false
        options:
          format: html
          media: false
          switcher: false
        description: "Si es deixa buit, la web mostra el text en valencià."

  # --------------------------------------------------------------------
  # Configuració de la web — interruptor global de la secció Extraescolars
  # (mentre s'estan preparant les fitxes del curs nou, per exemple).
  # --------------------------------------------------------------------
  - name: web
    label: "Configuració de la web"
    type: file
    path: content/web.yml
    format: yaml
    fields:
      - name: extraescolars_visibles
        label: "Secció Extraescolars visible a la web"
        type: boolean
        default: true
        description: "Desmarca-ho mentre s'estan preparant les fitxes del curs: desapareixen del menú, del peu i de la portada, i la pàgina Extraescolars mostra només l'avís de davall."

      - name: extraescolars_avis
        label: "Avís que es mostra quan la secció està oculta"
        type: string

      - name: extraescolars_avis_es
        label: "Avís (castellà)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el text en valencià."

  # --------------------------------------------------------------------
  # Junta AFA — una fitxa per membre.
  # --------------------------------------------------------------------
  - name: junta
    label: Junta AFA
    type: collection
    path: content/junta
    format: yaml
    filename: "{primary}.yml"
    exclude: ["_comissions.yml"]
    view:
      primary: nom
      sort: [ordre]
    fields:
      - name: nom
        label: Nom i cognoms
        type: string
        required: true

      - name: ordre
        label: "Orde d'aparició (1 = primer/a)"
        type: number
        default: 99

      - name: carrec
        label: Càrrec
        type: string
        required: true

      - name: carrec_es
        label: "Càrrec (castellà)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el càrrec en valencià."

      - name: email
        label: "Email de contacte (opcional)"
        type: string
        required: false

      - name: imatge
        label: Fotografia
        type: image
        required: false
        options:
          media: cms

  # --------------------------------------------------------------------
  # Comissions de l'AFA — fitxer únic (llista compartida, no és per membre).
  # --------------------------------------------------------------------
  - name: comissions
    label: Comissions de l'AFA
    type: file
    path: content/junta/_comissions.yml
    format: yaml
    fields:
      - name: comissions
        label: Comissions
        type: object
        list: true
        fields:
          - name: nom
            label: Nom de la comissió
            type: string
          - name: nom_es
            label: "Nom de la comissió (castellà)"
            type: string
            required: false
            description: "Si es deixa buit, la web mostra el nom en valencià."
          - name: contacte
            label: Persona/es de contacte
            type: string

  # --------------------------------------------------------------------
  # Blog — Notícies i avisos.
  # --------------------------------------------------------------------
  - name: blog
    label: Blog
    type: collection
    path: content/blog
    format: yaml
    filename: "{year}-{month}-{day}-{primary}.yml"
    view:
      primary: titol
      sort: [data]
      order: desc
    fields:
      - name: titol
        label: Títol de l'entrada
        type: string
        required: true

      - name: titol_es
        label: "Títol de l'entrada (castellà)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el títol en valencià."

      - name: data
        label: Data de publicació
        type: date
        required: true

      - name: data_label
        label: "Data en text (com es mostra a la web, p. ex. «4 de juny de 2026»)"
        type: string
        required: true

      - name: data_label_es
        label: "Data en text (castellà, p. ex. «4 de junio de 2026»)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el text en valencià."

      - name: cos_valencia
        label: "Text en valencià"
        type: rich-text
        options:
          format: html
          media: cms
          path: assets/uploads/cms
          switcher: false

      - name: cos_castella
        label: "Text en castellà"
        type: rich-text
        options:
          format: html
          media: cms
          path: assets/uploads/cms
          switcher: false

      - name: imatge
        label: "Imatge (opcional)"
        type: image
        required: false
        options:
          media: cms

  # --------------------------------------------------------------------
  # Pàgines estàtiques — qui-som, fes-te-de-lafa, contacte, mes-que-verd,
  # estatuts. NO inclou "index" (portada) ni "galeria": fora d'abast v1.
  # --------------------------------------------------------------------
  - name: pagines
    label: "Pàgines (Qui som, Fes-te membre, Contacte...)"
    type: collection
    path: content/pagines
    format: yaml
    filename: "{primary}.yml"
    operations:
      create: false
      delete: false
      rename: false
    # Estes 5 pàgines ja existixen i no se n'han d'afegir ni llevar —
    # només editar el seu contingut (per això es bloquegen les operacions).
    view:
      primary: titol
    fields:
      - name: visible
        label: "Visible a la web (desmarca-ho mentre la pàgina està en preparació)"
        type: boolean
        default: true
        description: "Si està desmarcat, la pàgina desapareix del menú i del peu, i la seua adreça mostra un avís «pàgina en preparació» en lloc del contingut."

      - name: titol
        label: "Títol (H1 de la pàgina)"
        type: string
        required: true

      - name: titol_es
        label: "Títol (castellà)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el títol en valencià."

      - name: titol_pestanya
        label: "Títol de la pestanya del navegador (opcional, si ha de ser diferent del H1)"
        type: string
        required: false

      - name: titol_pestanya_es
        label: "Títol de la pestanya del navegador (castellà, opcional)"
        type: string
        required: false

      - name: subtitol
        label: Subtítol
        type: string
        required: true

      - name: subtitol_es
        label: "Subtítol (castellà)"
        type: string
        required: false
        description: "Si es deixa buit, la web mostra el subtítol en valencià."

      - name: meta_desc
        label: "Descripció curta per a cercadors (SEO)"
        type: text
        required: true
        options:
          maxlength: 300

      - name: meta_desc_es
        label: "Descripció curta per a cercadors — castellà (SEO)"
        type: text
        required: false
        options:
          maxlength: 300
        description: "Si es deixa buit, la web usa la descripció en valencià."

      - name: cos
        label: "Contingut de la pàgina"
        type: rich-text
        options:
          format: html
          media: cms
          path: assets/uploads/cms
          switcher: false

      - name: cos_es
        label: "Contingut de la pàgina (castellà)"
        type: rich-text
        required: false
        options:
          format: html
          media: cms
          path: assets/uploads/cms
          switcher: false
        description: "Si es deixa buit, la web mostra el contingut en valencià."
